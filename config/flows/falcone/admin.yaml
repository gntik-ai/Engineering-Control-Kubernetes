flows:
  - schema_version: 1
    id: valid-login-admin
    project: falcone
    persona: privileged-admin
    category: authentication
    purpose: Authenticate a tenant/workspace administrator using the documented console route.
    preconditions: [privileged-admin credential reference passes preflight]
    steps:
      - {channel: browser, action: navigate, target: /login}
      - {channel: browser, action: fill-credential, target: "input[name='username']", value_ref: credential.username}
      - {channel: browser, action: fill-credential, target: "input[name='password']", value_ref: credential.password}
      - {channel: browser, action: click, target: "button[type='submit']"}
      - {channel: browser, action: assert-url, target: /}
    expected_result: The administrator receives only the configured tenant/workspace privileges.
    positive_controls: [login succeeds, admin navigation is visible]
    negative_controls: [invalid password fails without a session]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [non-production test identity]
    evidence_requirements: [browser trace, screenshot, console, redacted HTTP summary]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: tenant-admin-overview
    project: falcone
    persona: privileged-admin
    category: admin
    purpose: Read the configured tenant administration overview.
    preconditions: [valid-login-admin completed, safe tenant ID configured]
    steps:
      - {channel: api, action: request, target: /v1/tenants/<tenant-id>, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /console/tenants/<tenant-id>/plan}
      - {channel: browser, action: assert-visible, target: body}
    expected_result: Tenant administration data is visible only within the bound tenant.
    positive_controls: [configured tenant dashboard succeeds]
    negative_controls: [different tenant ID is denied]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only configured test tenant]
    evidence_requirements: [browser trace, screenshot, HTTP summary, correlation IDs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: workspace-note-crud
    project: falcone
    persona: privileged-admin
    category: admin
    purpose: Create, read, update, and delete one disposable workspace documentation note.
    preconditions: [valid-login-admin completed, safe workspace ID configured, SAFE_E2E_MUTATION is explicitly true]
    steps:
      - {channel: api, action: request, target: /v1/workspaces/<workspace-id>/docs/notes, method: POST, expected_status: 201, body_template: {content: "e2e-<campaign-id>-note"}}
      - {channel: api, action: request, target: /v1/workspaces/<workspace-id>/docs, method: GET, expected_status: 200}
      - {channel: api, action: request, target: /v1/workspaces/<workspace-id>/docs/notes/<created-id>, method: PUT, expected_status: 200, body_template: {content: "e2e-<campaign-id>-note-updated"}}
      - {channel: api, action: request, target: /v1/workspaces/<workspace-id>/docs/notes/<created-id>, method: DELETE, expected_status: 204}
      - {channel: api, action: request, target: /v1/workspaces/<workspace-id>/docs, method: GET, expected_status: 200, value_ref: "assert-json-absent:<created-id>"}
    expected_result: The disposable documentation note completes CRUD and is absent after cleanup.
    positive_controls: [created note appears in workspace documentation, update is visible]
    negative_controls: [ordinary user cannot manage notes, deleted note cannot be updated]
    resources_created: [e2e-<campaign-id>-note]
    cleanup_instructions: [delete the created note, verify a later docs read omits its note ID]
    safe_target_requirements: [explicit disposable test workspace, SAFE_E2E_MUTATION=true]
    evidence_requirements: [redacted HTTP summary, created resource handle, cleanup verification]
    timeout_seconds: 300
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: disposable
