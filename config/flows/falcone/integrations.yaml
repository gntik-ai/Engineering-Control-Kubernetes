flows:
  - schema_version: 1
    id: integration-health
    project: falcone
    persona: developer-operator
    category: integrations
    purpose: Correlate public control-plane readiness with scoped workload observation.
    preconditions: [developer-operator credential passes, observer credential passes]
    steps:
      - {channel: api, action: request, target: /readyz, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /}
      - {channel: browser, action: capture, target: operator-health}
    expected_result: Product health and workload readiness agree for the same revision.
    positive_controls: [ready endpoint succeeds]
    negative_controls: [Secret values are never queried or captured]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only observer only]
    evidence_requirements: [HTTP summary, readiness, image digests, events, bounded redacted logs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
