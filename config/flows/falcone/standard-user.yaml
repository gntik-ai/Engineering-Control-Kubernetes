flows:
  - schema_version: 1
    id: valid-login-standard
    project: falcone
    persona: standard-user
    category: authentication
    purpose: Authenticate a workspace developer through the real console session route.
    preconditions: [standard-user credential reference passes preflight]
    steps:
      - {channel: browser, action: navigate, target: /login}
      - {channel: browser, action: fill-credential, target: "input[name='username']", value_ref: credential.username}
      - {channel: browser, action: fill-credential, target: "input[name='password']", value_ref: credential.password}
      - {channel: browser, action: click, target: "button[type='submit']"}
      - {channel: browser, action: assert-url, target: /}
    expected_result: The ordinary user receives a bounded authenticated session.
    positive_controls: [POST /v1/auth/login-sessions succeeds, authenticated shell is visible]
    negative_controls: [an invalid-password control is rejected without a session]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [non-production test identity, credential runner isolation]
    evidence_requirements: [browser trace, screenshot, console, failed requests, redacted HTTP summary]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: session-refresh-standard
    project: falcone
    persona: standard-user
    category: authentication
    purpose: Verify session persistence and the documented session refresh route.
    preconditions: [valid-login-standard completed]
    steps:
      - {channel: browser, action: navigate, target: /}
      - {channel: browser, action: assert-visible, target: body}
      - {channel: api, action: request, target: /v1/auth/login-sessions/<session-id>/refresh, method: POST, expected_status: 200, body_template: {refreshToken: "<credential.refresh-token>"}}
    expected_result: Refresh preserves the same bounded product identity and scope.
    positive_controls: [authenticated page remains available]
    negative_controls: [unknown session refresh is rejected]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [runner substitutes only its current session ID]
    evidence_requirements: [redacted HTTP summary, correlation IDs]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: non-mutating
  - schema_version: 1
    id: logout-standard
    project: falcone
    persona: standard-user
    category: authentication
    purpose: End the product session and prove post-logout authorization denial.
    preconditions: [valid-login-standard completed]
    steps:
      - {channel: api, action: request, target: /v1/auth/login-sessions/<session-id>, method: DELETE, expected_status: 200, body_template: {refreshToken: "<credential.refresh-token>"}}
      - {channel: browser, action: navigate, target: /}
      - {channel: browser, action: assert-url, target: /login}
    expected_result: Logout invalidates the session and protected navigation redirects to login.
    positive_controls: [logout accepts the current session]
    negative_controls: [post-logout protected API request is denied]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [runner substitutes only its current session ID]
    evidence_requirements: [browser trace, redacted HTTP summary]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: non-mutating
  - schema_version: 1
    id: workspace-read
    project: falcone
    persona: standard-user
    category: standard-user
    purpose: Exercise the ordinary-user workspace inventory journey.
    preconditions: [valid-login-standard completed, user has one configured workspace]
    steps:
      - {channel: api, action: request, target: /v1/workspaces, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /console/workspaces}
      - {channel: browser, action: assert-visible, target: body}
    expected_result: Only workspaces visible to the ordinary user are returned and rendered.
    positive_controls: [workspace list succeeds]
    negative_controls: [no cross-tenant workspace appears]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only journey]
    evidence_requirements: [browser trace, screenshot, HTTP summary, correlation IDs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
