flows:
  - schema_version: 1
    id: public-smoke
    project: falcone
    persona: anonymous
    category: public
    purpose: Verify the public web console, TLS termination, and documented health behavior.
    preconditions: [runtime URL resolves, target is configured read-only]
    steps:
      - {channel: browser, action: navigate, target: /}
      - {channel: browser, action: assert-visible, target: body}
      - {channel: browser, action: capture, target: main-page}
      - {channel: api, action: request, target: /healthz, method: GET, expected_status: 200}
    expected_result: The page loads without fatal JavaScript or network failures and health is 200.
    positive_controls: [TLS handshake succeeds, body is non-empty]
    negative_controls: [authenticated workspace data is absent]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [HTTPS runtime URL, non-mutating public request]
    evidence_requirements: [browser trace, screenshot, JavaScript console, failed requests, HTTP summary]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
