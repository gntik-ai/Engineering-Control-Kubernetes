flows:
  - schema_version: 1
    id: insufficient-role-denied
    project: falcone
    persona: standard-user
    category: authorization
    purpose: Prove an ordinary user cannot invoke tenant administration directly.
    preconditions: [valid-login-standard completed, different tenant ID configured]
    steps:
      - {channel: api, action: request, target: /v1/tenants/<other-tenant-id>, method: GET, expected_status: 403}
      - {channel: browser, action: navigate, target: /console/tenants/<other-tenant-id>/plan}
      - {channel: browser, action: assert-visible, target: h1, value_ref: Necesitas permisos de superadmin}
    expected_result: Direct API and URL access fail without leaking cross-tenant data.
    positive_controls: [workspace-read succeeds for the same identity]
    negative_controls: [cross-tenant response is 403 or opaque 404]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only negative control]
    evidence_requirements: [browser trace, HTTP summary, correlation IDs]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: platform-cross-tenant-read
    project: falcone
    persona: platform-administrator
    category: authorization
    purpose: Validate the explicit platform role control for cross-tenant audit visibility.
    preconditions: [platform-administrator credential reference passes preflight]
    steps:
      - {channel: api, action: request, target: /v1/tenants/<configured-tenant-id>, method: GET, expected_status: 200}
    expected_result: The platform administrator succeeds with an auditable correlation ID.
    positive_controls: [configured tenant inventory succeeds]
    negative_controls: [standard-user execution of the same call is denied]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only platform audit identity]
    evidence_requirements: [HTTP summary, correlation IDs]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: non-mutating
