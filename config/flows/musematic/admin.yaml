flows:
  - schema_version: 1
    id: valid-login-admin
    project: musematic
    persona: privileged-admin
    category: authentication
    purpose: Authenticate a workspace owner/administrator through the documented login API.
    preconditions: [privileged-admin credential reference passes preflight]
    steps:
      - {channel: browser, action: navigate, target: /login}
      - {channel: browser, action: fill-credential, target: "input[name='email']", value_ref: credential.username}
      - {channel: browser, action: fill-credential, target: "input[name='password']", value_ref: credential.password}
      - {channel: browser, action: click, target: "button[type='submit']"}
      - {channel: browser, action: assert-url, target: /}
    expected_result: The administrator receives only its configured workspace privileges.
    positive_controls: [login succeeds, workspace administration is visible]
    negative_controls: [invalid password fails without a session]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [non-production test identity]
    evidence_requirements: [browser trace, screenshot, console, redacted HTTP summary]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: workspace-admin-overview
    project: musematic
    persona: privileged-admin
    category: admin
    purpose: Read the configured workspace administration summary and settings.
    preconditions: [valid-login-admin completed, safe workspace ID configured]
    steps:
      - {channel: api, action: request, target: /api/v1/workspaces/<workspace-id>/summary, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /workspaces/<workspace-id>/settings}
      - {channel: browser, action: assert-visible, target: body}
    expected_result: Workspace administration data is visible within the bound workspace.
    positive_controls: [configured workspace summary succeeds]
    negative_controls: [different workspace ID is denied]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only configured test workspace]
    evidence_requirements: [browser trace, screenshot, HTTP summary, correlation IDs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: workspace-crud
    project: musematic
    persona: privileged-admin
    category: admin
    purpose: Create, read, update, and delete one disposable workspace.
    preconditions: [valid-login-admin completed, SAFE_E2E_MUTATION is explicitly true]
    steps:
      - {channel: api, action: request, target: /api/v1/workspaces, method: POST, expected_status: 201, body_template: {name: "e2e-<campaign-id>-workspace"}}
      - {channel: api, action: request, target: /api/v1/workspaces/<created-id>, method: GET, expected_status: 200}
      - {channel: api, action: request, target: /api/v1/workspaces/<created-id>, method: PATCH, expected_status: 200, body_template: {name: "e2e-<campaign-id>-workspace-updated"}}
      - {channel: api, action: request, target: /api/v1/workspaces/<created-id>, method: DELETE, expected_status: 202}
      - {channel: api, action: request, target: /api/v1/workspaces/<created-id>, method: GET, expected_status: 404}
    expected_result: The disposable workspace completes CRUD and is absent after cleanup.
    positive_controls: [created workspace is readable, update is visible]
    negative_controls: [ordinary member cannot create, deleted workspace returns 404]
    resources_created: [e2e-<campaign-id>-workspace]
    cleanup_instructions: [delete the created workspace, verify GET returns 404]
    safe_target_requirements: [explicit disposable test tenant, SAFE_E2E_MUTATION=true]
    evidence_requirements: [redacted HTTP summary, created resource handle, cleanup verification]
    timeout_seconds: 300
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: disposable
