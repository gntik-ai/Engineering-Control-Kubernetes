flows:
  - schema_version: 1
    id: valid-login-standard
    project: musematic
    persona: standard-user
    category: authentication
    purpose: Authenticate a real workspace member through the documented login API.
    preconditions: [standard-user credential reference passes preflight]
    steps:
      - {channel: browser, action: navigate, target: /login}
      - {channel: browser, action: fill-credential, target: "input[name='email']", value_ref: credential.username}
      - {channel: browser, action: fill-credential, target: "input[name='password']", value_ref: credential.password}
      - {channel: browser, action: click, target: "button[type='submit']"}
      - {channel: browser, action: assert-url, target: /}
    expected_result: The member receives only its configured workspace session.
    positive_controls: [POST /api/v1/auth/login succeeds, authenticated shell is visible]
    negative_controls: [an invalid-password control is rejected]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [non-production test identity, runner-only credential access]
    evidence_requirements: [browser trace, screenshot, console, redacted HTTP summary]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
  - schema_version: 1
    id: session-refresh-standard
    project: musematic
    persona: standard-user
    category: authentication
    purpose: Verify session persistence and the documented refresh API.
    preconditions: [valid-login-standard completed]
    steps:
      - {channel: api, action: request, target: /api/v1/auth/refresh, method: POST, expected_status: 200, body_template: {refresh_token: "<credential.refresh-token>"}}
      - {channel: browser, action: navigate, target: /workspaces}
      - {channel: browser, action: assert-visible, target: body}
    expected_result: Refresh preserves the same user and workspace scope.
    positive_controls: [authenticated workspace navigation remains available]
    negative_controls: [invalid refresh token is rejected]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [refresh token remains inside browser runner]
    evidence_requirements: [redacted HTTP summary, browser trace, correlation IDs]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: non-mutating
  - schema_version: 1
    id: logout-standard
    project: musematic
    persona: standard-user
    category: authentication
    purpose: End the real session and prove protected pages are denied afterward.
    preconditions: [valid-login-standard completed]
    steps:
      - {channel: browser, action: click, target: "button[data-testid='logout']"}
      - {channel: browser, action: navigate, target: /workspaces}
      - {channel: browser, action: assert-url, target: /login}
    expected_result: Logout removes the session and protected navigation returns to login.
    positive_controls: [logout control completes]
    negative_controls: [post-logout workspace API is denied]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [non-mutating session operation]
    evidence_requirements: [browser trace, redacted HTTP summary]
    timeout_seconds: 120
    retry_policy: {maximum_attempts: 1, backoff_seconds: 0}
    mutation: non-mutating
  - schema_version: 1
    id: workspace-read
    project: musematic
    persona: standard-user
    category: standard-user
    purpose: Exercise the ordinary member workspace list and summary journey.
    preconditions: [valid-login-standard completed, user has a configured workspace]
    steps:
      - {channel: api, action: request, target: /api/v1/workspaces, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /workspaces}
      - {channel: browser, action: assert-visible, target: body}
    expected_result: Only workspaces visible to the member are returned and rendered.
    positive_controls: [workspace list succeeds]
    negative_controls: [no cross-workspace or cross-tenant record appears]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only journey]
    evidence_requirements: [browser trace, screenshot, HTTP summary, correlation IDs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
