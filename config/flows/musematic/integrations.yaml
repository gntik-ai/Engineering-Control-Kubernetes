flows:
  - schema_version: 1
    id: integration-health
    project: musematic
    persona: developer-operator
    category: integrations
    purpose: Correlate public health with scoped Argo CD and workload observation.
    preconditions: [developer-operator credential passes, observer credential passes]
    steps:
      - {channel: api, action: request, target: /health, method: GET, expected_status: 200}
      - {channel: browser, action: navigate, target: /}
      - {channel: browser, action: capture, target: operator-health}
    expected_result: Product health, Argo revision, and workload readiness agree.
    positive_controls: [health endpoint succeeds]
    negative_controls: [Secret values are never queried or captured]
    resources_created: []
    cleanup_instructions: []
    safe_target_requirements: [read-only observer only]
    evidence_requirements: [HTTP summary, Argo revision, readiness, image digests, events, bounded redacted logs]
    timeout_seconds: 180
    retry_policy: {maximum_attempts: 2, backoff_seconds: 2}
    mutation: non-mutating
