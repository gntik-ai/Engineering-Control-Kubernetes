version: 1
identities:
  codex-runner:
    may_read: [assigned-worktree, codex-auth]
    may_write: [assigned-worktree, own-run-directory]
    forbidden: [claude-auth, release-credentials, merge, deploy]
  claude-runner:
    may_read: [assigned-worktree, claude-auth]
    may_write: [assigned-worktree, own-run-directory]
    forbidden: [codex-auth, release-credentials, merge, deploy]
  browser-runner:
    may_read: [journey-config, test-credential-file]
    forbidden: [model-auth, release-credentials, production-admin]
  scan-runner:
    may_read: [assigned-worktree]
    forbidden: [model-auth, release-credentials]
  release-runner:
    may_read: [approved-release-plan, scoped-release-credentials]
    forbidden: [codex-auth, claude-auth, arbitrary-prompt, general-shell]
kubernetes:
  identities: [observer, preview-releaser, falcone-staging-releaser, musematic-staging-releaser, production-releaser]
  cluster_admin_normal_automation: false
  observer_secret_values: false
