version: 1
project: falcone
source:
  repository: gntik-ai/falcone
  default_branch: main
  discovered_controller_path: /home/hermes/projects/falcone
  discovered_head: 3ecc86496e6fa121910471f893a44017aa75fb78
deployment:
  repository: gntik-ai/falcone-charts
  default_branch: main
  strategy: helm
  discovered_controller_path: /home/hermes/projects/falcone-charts
  discovered_head: 95dd05540ae04815051c77ecf2a426d27af4f373
  adapter: engineering_control.adapters.falcone.release.FalconeHelmAdapter
  required_gates:
    - chart-lint
    - chart-template
    - immutable-image-digests
    - migration-parity
    - real-backup-evidence-when-required
    - independent-release-review
    - immutable-approval-binding
  prohibited:
    - fake-backup-evidence
    - migration-safety-bypass
    - llm-direct-helm
components:
  - falcone:control-plane
  - falcone:gateway
  - falcone:web-console
  - falcone:charts:staging
security_blockers:
  - id: SECURITY_BLOCKER_KUBERNETES_CLUSTER_ADMIN_IDENTITY
    write_enablement: false
    remediation: provision scoped observer and Falcone release identities
delivery_control:
  source_ci_workflow: ci
  candidate_build:
    enabled: false
    workflow_name: release-images
    artifact_name: engineering-control-artifacts
    manifest_file: engineering-artifacts.json
    signer_workflow: gntik-ai/falcone/.github/workflows/release-images.yml
    deny_self_hosted_runners: true
    blocker: FALCONE_CANDIDATE_BUILD_CONTRACT_MISSING
  immutable_promotion:
    enabled: true
    deployment_file: charts/in-falcone/values/staging.yaml
    chart_directory: charts/in-falcone
    values_files:
      - charts/in-falcone/values/staging.yaml
    component_lease: falcone:charts:staging
    image_repositories:
      control-plane: ghcr.io/gntik-ai/in-falcone-control-plane
      control-plane-executor: ghcr.io/gntik-ai/in-falcone-control-plane-executor
      web-console: ghcr.io/gntik-ai/in-falcone-web-console
      function-runtime: ghcr.io/gntik-ai/in-falcone-fn-runtime
      workflow-worker: ghcr.io/gntik-ai/in-falcone-workflow-worker
      mcp-runtime: ghcr.io/gntik-ai/in-falcone-mcp-runtime
    digest_paths:
      control-plane: controlPlane.image.digest
      control-plane-executor: controlPlaneExecutor.image.digest
      web-console: webConsole.image.digest
      function-runtime: controlPlane.functionExecutor.runtimeImage.digest
      workflow-worker: workflowWorker.image.digest
      mcp-runtime: mcp.runtimeImage.digest
