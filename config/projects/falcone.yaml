schema_version: 1
project: falcone
api_url: https://baas.musematic.ai
repositories:
  source:
    full_name: gntik-ai/falcone
    url: https://github.com/gntik-ai/falcone.git
    mirror: /srv/engineering/mirrors/falcone.git
    default_branch: main
    issue_repository: gntik-ai/falcone
  deployment:
    full_name: gntik-ai/falcone-charts
    url: https://github.com/gntik-ai/falcone-charts.git
    mirror: /srv/engineering/mirrors/falcone-charts.git
    default_branch: main
    issue_repository: gntik-ai/falcone-charts
deployment:
  strategy: argocd
  adapter: falcone
  chart_repository: deployment
  chart_path: charts/in-falcone
  values_paths: [charts/in-falcone/values.yaml]
  secret_bearing_values_paths: []
  build_workflows:
    - repository: gntik-ai/falcone
      workflow: release-images.yml
      exact_sha_input: false
      immutable_digest_output: false
      enabled: false
      blocker: FALCONE_EXACT_SHA_CANDIDATE_CONTRACT_MISSING
  image_repositories:
    control-plane: ghcr.io/gntik-ai/in-falcone-control-plane
    control-plane-executor: ghcr.io/gntik-ai/in-falcone-control-plane-executor
    web-console: ghcr.io/gntik-ai/in-falcone-web-console
    function-runtime: ghcr.io/gntik-ai/in-falcone-fn-runtime
    workflow-worker: ghcr.io/gntik-ai/in-falcone-workflow-worker
    mcp-runtime: ghcr.io/gntik-ai/in-falcone-mcp-runtime
  runtime_url: https://baas.musematic.ai
  helm_release: falcone
  argocd_application: falcone-staging
  kubernetes_context_ref: falcone-observer
  api_server_identity: https://178.104.182.200:6443
  namespaces: [in-falcone-staging, argocd]
  observer_credential_ref: file:/etc/engineering-control/credentials/falcone/observer.kubeconfig
  deployment_revision_annotation: engineering.gntik.ai/deployment-sha
  helm_release_revision_annotation: engineering.gntik.ai/helm-release-revision
  preview_policy:
    enabled: false
    isolated_target_required: true
    namespace_prefix: falcone-preview-
    approval_required: true
    credential_ref: file:/etc/engineering-control/credentials/falcone/preview-releaser.kubeconfig
    blocker: FALCONE_DISPOSABLE_PREVIEW_TARGET_MISSING
  staging_policy:
    enabled: false
    production: false
    approval_required: true
    credential_ref: file:/etc/engineering-control/credentials/falcone/staging-releaser.kubeconfig
    blocker: FALCONE_SCOPED_STAGING_RELEASER_AND_REPOSITORY_VALUES_MISSING
source_test_commands:
  - [corepack, pnpm, test]
  - [corepack, pnpm, --dir, apps/web-console, test]
deployment_test_commands:
  - [helm, lint, charts/in-falcone]
  - [helm, template, engineering-render, charts/in-falcone, --namespace, in-falcone-staging]
# NEW-118: falcone's CI checks out falcone-charts at this pin, and its contract test
# (tests/blackbox/mongo-gateway-route.test.mjs) requires it to equal the deployment head.
# Hermes sets it to the paired deployment worktree HEAD after the deployment maker.
deployment_pin:
  files: [.github/workflows/ci.yml, .github/workflows/integration.yml]
  variable: FALCONE_CHARTS_REF
delivery_control:
  source_ci_workflow: ci
  candidate_build:
    enabled: false
    workflow_name: release-images
    artifact_name: engineering-control-artifacts
    manifest_file: engineering-artifacts.json
    signer_workflow: gntik-ai/falcone/.github/workflows/release-images.yml
    deny_self_hosted_runners: true
    blocker: FALCONE_CANDIDATE_BUILD_CONTRACT_MISSING
  immutable_promotion:
    enabled: true
    deployment_file: charts/in-falcone/values/staging.yaml
    chart_directory: charts/in-falcone
    values_files: [charts/in-falcone/values/staging.yaml]
    component_lease: falcone:charts:staging
    image_repositories:
      control-plane: ghcr.io/gntik-ai/in-falcone-control-plane
      control-plane-executor: ghcr.io/gntik-ai/in-falcone-control-plane-executor
      web-console: ghcr.io/gntik-ai/in-falcone-web-console
      function-runtime: ghcr.io/gntik-ai/in-falcone-fn-runtime
      workflow-worker: ghcr.io/gntik-ai/in-falcone-workflow-worker
      mcp-runtime: ghcr.io/gntik-ai/in-falcone-mcp-runtime
    digest_paths:
      control-plane: controlPlane.image.digest
      control-plane-executor: controlPlaneExecutor.image.digest
      web-console: webConsole.image.digest
      function-runtime: controlPlane.functionExecutor.runtimeImage.digest
      workflow-worker: workflowWorker.image.digest
      mcp-runtime: mcp.runtimeImage.digest
  staging_flow:
    enabled: true
    maximum_concurrency: 2  # NEW-214 operator decision 2026-10-17
    kind: argocd-image-updater
    argo_application: falcone-staging
    argo_namespace: argocd
    namespaces: [in-falcone-staging]
    source_ci_workflow: ci
    # NEW-103: the deployment PR's CI must pass before either PR merges.
    deployment_ci_workflow: Chart release
    # main CI does not publish images; release-images does, on the v*.*.* tag Hermes pushes
    # on the merge commit (gntik-ai/falcone#1026).
    main_ci_workflow: null
    image_workflow: release-images.yml
    release_tag:
      enabled: true
      prefix: v
      bump: patch
    deploy_repository: gntik-ai/falcone-charts
    deploy_values_file: charts/in-falcone/values/staging-argocd.yaml
    deploy_branch: main
    image_repositories:
      - ghcr.io/gntik-ai/in-falcone-control-plane
      - ghcr.io/gntik-ai/in-falcone-control-plane-executor
      - ghcr.io/gntik-ai/in-falcone-web-console
      - ghcr.io/gntik-ai/in-falcone-fn-runtime
      - ghcr.io/gntik-ai/in-falcone-workflow-worker
      - ghcr.io/gntik-ai/in-falcone-mcp-runtime
    tag_prefix: sha-
    tag_length: 7
    # The chart lives in falcone-charts main, not in the source repo.
    pin_chart_to_merge: false
    allow_r3_merge: true
    # NEW-63 for falcone: PR CI failures that also occur on unchanged main (for example
    # the pnpm-audit `security` job before gntik-ai/falcone#1030) do not block delivery;
    # only jobs failing in the PR but not on a baseline PR from main do. falcone's ci.yml
    # has no path filters, so one root marker runs every job; the scopes cover every
    # top-level entry. The exemption is per job (activities/gitops.py): a failing PR job
    # passes only if the same job also failed on the baseline, and a PR touching no
    # covered path gets no baseline at all (CI_BASELINE_NOT_APPLICABLE); one that changes
    # .github/ never gets it (CI_BASELINE_CI_CONFIG_CHANGED), so .github/ is not a scope.
    ci_baseline:
      enabled: true
      markers:
        - {scope: .dockerignore, path: .hermes-ci-baseline}
        - {scope: .env.example, path: .hermes-ci-baseline}
        - {scope: .gitignore, path: .hermes-ci-baseline}
        - {scope: .idea/, path: .hermes-ci-baseline}
        - {scope: .markdownlint-cli2.jsonc, path: .hermes-ci-baseline}
        - {scope: LICENSE, path: .hermes-ci-baseline}
        - {scope: README, path: .hermes-ci-baseline}
        - {scope: apps/, path: .hermes-ci-baseline}
        - {scope: delivery-adapter/, path: .hermes-ci-baseline}
        - {scope: deploy/, path: .hermes-ci-baseline}
        - {scope: docs, path: .hermes-ci-baseline}
        - {scope: falcone-loop-state/, path: .hermes-ci-baseline}
        - {scope: internal-contracts/, path: .hermes-ci-baseline}
        - {scope: logo, path: .hermes-ci-baseline}
        - {scope: openspec/, path: .hermes-ci-baseline}
        - {scope: package.json, path: .hermes-ci-baseline}
        - {scope: packages/, path: .hermes-ci-baseline}
        - {scope: pnpm-, path: .hermes-ci-baseline}
        - {scope: scripts/, path: .hermes-ci-baseline}
        - {scope: service-catalog.json, path: .hermes-ci-baseline}
        - {scope: spikes/, path: .hermes-ci-baseline}
        - {scope: tests/, path: .hermes-ci-baseline}
        - {scope: tools/, path: .hermes-ci-baseline}
        - {scope: turbo.json, path: .hermes-ci-baseline}
    external_secrets_namespace: external-secrets
    external_secrets_deployment: external-secrets
# NEW-120: side-by-side console migration to gntik-ui (design docs/ui-migration, decisions
# 2026-10-04). Exact version and digest-pinned MCP image.
# NEW-149 (operator decision 2026-10-07): gntik-ui's first stable release, 0.2.0, published to
# GitHub Packages on 2026-10-05 (release commit 5124d34), replaces the canary
# 0.0.0-canary-20261003230037 (main fe6ccc0) the approved blueprint was planned on; between
# fe6ccc0 and main de2cdde only versions, changelogs and the release workflow changed. The
# digest is the multi-arch index of ghcr.io/gntik-ai/gntik-ui-mcp:sha-de2cdde (main after
# the 0.2.0 registry regeneration). Pre-pull it on the worker before the next kit snapshot.
# Operator decision 2026-10-11: one bump after gntik-ui#17 shipped, from 0.2.0 to 0.4.0
# (0.3.0 released 10-11 at e7c40ba, 0.4.0 at 20579e2 with the flow-builder extensions).
# The digest is the multi-arch index of ghcr.io/gntik-ai/gntik-ui-mcp:sha-20579e2.
# Operator rule 2026-10-13: the falcone kit comes only from public npm (registry.npmjs.org),
# never GitHub Packages. Bump to 0.7.0 (released 10-17 from main ef0e0dc, Version Packages
# gntik-ui#89); the digest is the multi-arch index of ghcr.io/gntik-ai/gntik-ui-mcp:sha-ef0e0dc.
# Operator decision 2026-10-20 (UI migration start): bump to 0.9.0 before wave u1 (released
# 10-20 from main 36afdb3, Version Packages gntik-ui#652); the digest is the multi-arch index
# of ghcr.io/gntik-ai/gntik-ui-mcp:sha-36afdb3.
# Bump to 0.10.0 (released 2026-10-21 from main 8a43a41, Version Packages gntik-ui#679):
# blocks and templates read built-in labels from the en/es catalogs (gntik-ui #685), which
# the first u1 page delivery (falcone #1215) needed. The digest is the multi-arch index of
# ghcr.io/gntik-ai/gntik-ui-mcp:sha-8a43a41.
# Bump to 0.11.0 (released 2026-10-24 from main 2f83673, Version Packages gntik-ui#690): the
# u1 kit gaps gntik-ui #693 (detail card and page header options), #694 (LogViewer levels and wrap) and #695
# (shell-less resource detail with caller tabs). The digest is the multi-arch index of
# ghcr.io/gntik-ai/gntik-ui-mcp:sha-2f83673.
ui_migration:
  legacy_app: apps/web-console
  target_app: apps/web-console-next
  api_package: packages/console-api
  gntik_ui:
    registry: registry.npmjs.org
    scope: "@gntik-ai"
    version: 0.11.0
  mcp:
    image: ghcr.io/gntik-ai/gntik-ui-mcp
    digest: sha256:f07840f66bacee065b6bff1535edca9478a895a2af434ac8b2f2bd7b6e406788
    socket: /run/gntik-ui-mcp/mcp.sock
  route_tables:
    control_plane_routes: apps/control-plane/routes.mjs
    control_plane_runtime_map: apps/control-plane/route-map.runtime.json
    public_route_catalog: packages/internal-contracts/src/public-route-catalog.json
    executor_openapi: apps/control-plane-executor/openapi/control-plane.openapi.json
    gateway_config: deploy/kind/apisix/apisix.yaml
  staging_base_url: https://baas.musematic.ai
  staging_next_path: /next/
  languages: [es, en]
  default_language: es
# Standing maker rules (2026-10-04): falcone-charts #15, #16 and #17 each needed a CI
# repair round because new values keys broke `helm upgrade --reuse-values` of existing
# releases (test bbx-temporal-bootstrap-048).
toolchain:
  # NEW-196: prepared by the scan worker (delivery.prepare_toolchain) in the source
  # worktree before the maker runs; makers and the checker have no network. Without it
  # a maker has no node_modules: falcone #1071 (adopt the @gntik-ai kit from npm) stopped
  # because it could not read the kit's installed APIs. Node 22 and the worker's pnpm,
  # as falcone's CI and the web-console image (node:22-alpine) use.
  enabled: true
  prepare:
    - cwd: "."
      argv: [pnpm, install, --frozen-lockfile]
      timeout_seconds: 1800
    # The tests read the charts repository beside the checkout (../falcone-charts), as
    # the repository's CI sets it up: at the commit its ci.yml names (FALCONE_CHARTS_REF).
    # It is a public repository, fetched without a token, outside the checkout.
    - cwd: "."
      argv:
        - bash
        - -euc
        - >-
          ref=$(sed -n "s/^ *FALCONE_CHARTS_REF: *'\([0-9a-f]*\)'.*/\1/p" .github/workflows/ci.yml);
          test -n "$ref";
          rm -rf ../falcone-charts;
          git init --quiet ../falcone-charts;
          git -C ../falcone-charts -c core.hooksPath=/dev/null fetch --quiet --depth 1
          https://github.com/gntik-ai/falcone-charts.git "$ref";
          git -C ../falcone-charts -c core.hooksPath=/dev/null checkout --quiet FETCH_HEAD
      timeout_seconds: 600
  # Each suite of the repository's CI that needs no service is a command of its own, so
  # that one that fails on the default branch does not hide the others. All of them pass
  # without network with the charts beside the checkout (tried on 2cb8214).
  test_commands:
    - cwd: "."
      argv: [pnpm, lint]
      description: repository validators, markdown lint and the OpenAPI check (CI "Lint")
    - cwd: "."
      argv: [pnpm, "test:unit"]
      description: unit tests (node --test tests/unit; about four minutes)
    - cwd: "."
      argv: [pnpm, "test:adapters"]
      description: adapter tests
    - cwd: "."
      argv: [pnpm, "test:contracts"]
      description: contract tests
    - cwd: "."
      argv: [pnpm, "test:e2e:console"]
      description: console end-to-end tests that run in process
    - cwd: "."
      argv: [pnpm, "test:e2e:deployment"]
      description: deployment end-to-end tests that run in process (they read the charts)
    - cwd: "."
      argv: [pnpm, "test:e2e:observability"]
      description: observability end-to-end tests that run in process
    - cwd: "."
      argv: [pnpm, "test:resilience"]
      description: resilience tests
    - cwd: "."
      argv: [pnpm, "test:e2e:workflows"]
      description: workflow end-to-end tests that run in process
    - cwd: "."
      argv: [pnpm, --dir, apps/web-console, test]
      description: web console unit tests (vitest)
maker_rules:
  source:
    - >-
      apps/web-console-next: SHELL_TEST_FIXTURES=true is a build flag for the Playwright
      builds only (.github/workflows/ci.yml). CI never runs the full vitest suite with it,
      and in that mode the route-set assertion fails on main too, because router.tsx adds
      /console/__fixture/*. Do not run or block on a fixture-mode full vitest run. The gates
      are the normal vitest suite, the separate fixture tests and the CI browser jobs.
    - >-
      Chromium cannot launch in the maker sandbox. Report the browser parity, axe and
      viewport runs as SKIPPED ("Chromium unavailable; PR CI runs them") instead of
      blocking; they gate the pull request in CI. Visual review is not covered by CI: the
      parity screenshots still need the checker's assessment and operator approval.
    - >-
      Language (operator decision 2026-10-22): write new identifiers, code comments, test
      names and descriptions, commit messages and docs in English. User-facing copy in
      apps/web-console-next goes into both the en and es catalogs. Do not translate or
      rewrite existing Spanish text unless the issue asks for it.
    - >-
      Cluster test namespaces are a switch. Default (FS_TEST_NAMESPACE_MODE or
      FW_TEST_NAMESPACE_MODE=create): create and delete a dedicated fs-test-*/fw-test-*
      namespace as today; if creation is denied, fail before any mutation naming the switch.
      Mode shared: never create or delete namespaces; use the namespace in
      FS_TEST_NAMESPACE/FW_TEST_NAMESPACE; create only new objects named with the run id and
      labelled falcone.test/run=<id>; never update, patch, relabel or delete an object
      unless its label equals this run's id.
    - >-
      Checker (NEW-243, either provider): you are read-only on the maker's worktree. Run the
      listed commands and report each real PASS or FAIL. One that fails only because it
      cannot write (EACCES, EROFS, read-only file system on dist/, build output, caches or
      tsbuildinfo) is not a defect of the change: report it as "NOT RUN: read-only checker,
      write denied" with the error line, and judge the build from the maker's run and the
      diff; PR CI runs the full build. Request changes only for defects in the change.
  deployment:
    - >-
      Chart changes must survive `helm upgrade --reuse-values` from an existing release:
      read every new or renamed values key with a safe default (`default`, `dig` or
      `hasKey`) in templates and in templates/validate.yaml, so a release installed
      before this change still renders. Run the reuse-values upgrade test
      (bbx-temporal-bootstrap-048 in tests/blackbox/temporal-bootstrap) before finishing.
    - >-
      Language (operator decision 2026-10-22): write new identifiers, code comments, test
      names and descriptions, commit messages and docs in English. Do not translate or
      rewrite existing Spanish text unless the issue asks for it.
    - >-
      Hermes moves the falcone FALCONE_CHARTS_REF pins to your final commit only after
      you finish, so a check comparing those pins with the charts checkout (e.g.
      "both workflow pins match the deployment checkout" in
      tests/blackbox/mongo-gateway-route.test.mjs) fails until then. Report only that
      check as SKIPPED ("pin converges after the deployment maker; PR CI runs it").
      Run the file with FALCONE_CHART_PATH=<charts worktree>/charts/in-falcone; every
      other assertion in it must pass.
    - >-
      Cluster test namespaces are a switch. Default (FS_TEST_NAMESPACE_MODE or
      FW_TEST_NAMESPACE_MODE=create): create and delete a dedicated fs-test-*/fw-test-*
      namespace as today; if creation is denied, fail before any mutation naming the switch.
      Mode shared: never create or delete namespaces; use the namespace in
      FS_TEST_NAMESPACE/FW_TEST_NAMESPACE; create only new objects named with the run id and
      labelled falcone.test/run=<id>; never update, patch, relabel or delete an object
      unless its label equals this run's id.
# NEW-243 rotation (2026-10-31, after the gntik-ui pilot): rotate the delivery maker between
# Codex and Claude 50/50, chosen once per ChangeSet (kept for its retries, corrections and CI
# repairs); the checker is always the other provider; a Claude maker uses Sonnet 5.5, every
# other role keeps today's default model; the spec architect stays on Claude. ChangeSets created before enabled_at keep today's routing;
# enabled_at must be the install time or later. Revert this block alone to stop rotation for
# falcone; rotated ChangeSets keep their recorded providers.
provider_rotation:
  enabled: true
  enabled_at: "2026-11-01T01:00:00+00:00"
  ratio:
    codex: 1
    claude: 1
  roles:
    product-spec-architect:
      pin: claude   # today's spec routing prefers Claude; only the maker/checker pairing rotates
    implementer:
      models:
        claude: claude-sonnet-5-5   # operator 2026-10-31: a Claude maker always uses Sonnet 5.5
