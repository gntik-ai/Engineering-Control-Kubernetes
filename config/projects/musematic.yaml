version: 1
project: musematic
source:
  repository: gntik-ai/musematic
  default_branch: main
  discovered_controller_path: /home/hermes/projects/musematic
  discovered_head: 3e609bd80c10a7645cea3a1bb62e0f59392806c8
deployment:
  repository: gntik-ai/musematic-deploy
  default_branch: main
  strategy: argocd-gitops
  discovered_controller_path: /home/hermes/projects/musematic-deploy
  discovered_head: 419aebf8d1269a178dff3ba0a2974c311c67d0c9
  adapter: engineering_control.adapters.musematic.gitops.MusematicGitOpsAdapter
  required_gates:
    - protected-deployment-pr
    - immutable-image-digests
    - approved-git-sha
    - argocd-observed-revision
    - post-sync-verification
  prohibited:
    - newest-build-promotion
    - latest-tag-promotion
    - direct-main-image-writeback
    - undocumented-live-kubernetes-patch
    - llm-direct-argocd-sync
components:
  - musematic:control-plane
  - musematic:runtime-controller
  - musematic:web
  - musematic:deploy:staging
security_blockers:
  - id: SECURITY_BLOCKER_MUSEMATIC_GIT_SECRETS
    source_write_enablement: false
    deployment_write_enablement: false
    remediation: rotate credentials and remove them from current Git state/history through an R3 ChangeSet
  - id: SECURITY_BLOCKER_KUBERNETES_CLUSTER_ADMIN_IDENTITY
    write_enablement: false
    remediation: provision scoped observer and GitOps verification identities
discovered_argocd_risk:
  image_updater_strategy: newest-build
  writeback_target: main
  status: MUST_BE_REPLACED_BEFORE_PROMOTION_ENABLEMENT
delivery_control:
  source_ci_workflow: CI
  candidate_build:
    enabled: false
    workflow_name: Release
    artifact_name: engineering-control-artifacts
    manifest_file: engineering-artifacts.json
    signer_workflow: gntik-ai/musematic/.github/workflows/deploy.yml
    deny_self_hosted_runners: true
    blocker: MUSEMATIC_CANDIDATE_BUILD_CONTRACT_MISSING
  immutable_promotion:
    enabled: false
    deployment_file: apps/musematic-platform/values.override.yaml
    component_lease: musematic:deploy:staging
    image_repositories:
      control-plane: ghcr.io/gntik-ai/musematic-control-plane
      web: ghcr.io/gntik-ai/musematic-web
      reasoning-engine: ghcr.io/gntik-ai/musematic-reasoning-engine
      runtime-controller: ghcr.io/gntik-ai/musematic-runtime-controller
      sandbox-manager: ghcr.io/gntik-ai/musematic-sandbox-manager
      simulation-controller: ghcr.io/gntik-ai/musematic-simulation-controller
    digest_paths:
      control-plane: images.controlPlane.digest
      web: images.web.digest
      reasoning-engine: images.reasoningEngine.digest
      runtime-controller: images.runtimeController.digest
      sandbox-manager: images.sandboxManager.digest
      simulation-controller: images.simulationController.digest
    blocker: MUSEMATIC_DIGEST_RENDERING_UNSUPPORTED
