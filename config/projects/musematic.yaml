schema_version: 1
project: musematic
api_url: https://api.musematic.ai
repositories:
  source:
    full_name: gntik-ai/musematic
    url: https://github.com/gntik-ai/musematic.git
    mirror: /srv/engineering/mirrors/musematic.git
    default_branch: main
    issue_repository: gntik-ai/musematic
  deployment:
    full_name: gntik-ai/musematic-deploy
    url: https://github.com/gntik-ai/musematic-deploy.git
    mirror: /srv/engineering/mirrors/musematic-deploy.git
    default_branch: main
    issue_repository: gntik-ai/musematic-deploy
deployment:
  strategy: argocd
  adapter: musematic
  chart_repository: source
  chart_path: deploy/helm/platform
  values_paths: [deploy/helm/platform/values.prod.yaml]
  secret_bearing_values_paths: [apps/musematic-platform/values.override.yaml]
  build_workflows:
    - repository: gntik-ai/musematic
      workflow: ci.yml
      exact_sha_input: false
      immutable_digest_output: false
      enabled: false
      blocker: MUSEMATIC_EXACT_SHA_CANDIDATE_CONTRACT_MISSING
    - repository: gntik-ai/musematic
      workflow: deploy.yml
      exact_sha_input: false
      immutable_digest_output: false
      enabled: false
      blocker: MUSEMATIC_STABLE_WORKFLOW_IS_NOT_A_PREVIEW_CONTRACT
  image_repositories:
    control-plane: ghcr.io/gntik-ai/musematic/control-plane
    runtime-controller: ghcr.io/gntik-ai/musematic/runtime-controller
    reasoning-engine: ghcr.io/gntik-ai/musematic/reasoning-engine
    simulation-controller: ghcr.io/gntik-ai/musematic/simulation-controller
    sandbox-manager: ghcr.io/gntik-ai/musematic/sandbox-manager
    web: ghcr.io/gntik-ai/musematic/web
  runtime_url: https://app.musematic.ai
  helm_release: null
  argocd_application: musematic-platform
  kubernetes_context_ref: musematic-observer
  api_server_identity: https://178.104.182.200:6443
  namespaces: [musematic-platform, platform-data, argocd]
  observer_credential_ref: file:/etc/engineering-control/credentials/musematic/observer.kubeconfig
  deployment_revision_annotation: argocd.argoproj.io/tracking-id
  preview_policy:
    enabled: false
    isolated_target_required: true
    namespace_prefix: musematic-preview-
    approval_required: true
    credential_ref: file:/etc/engineering-control/credentials/musematic/preview-releaser.kubeconfig
    blocker: MUSEMATIC_ISOLATED_ARGOCD_PREVIEW_APPLICATION_MISSING
  staging_policy:
    enabled: false
    production: false
    approval_required: true
    credential_ref: file:/etc/engineering-control/credentials/musematic/staging-releaser.kubeconfig
    blocker: MUSEMATIC_DISCOVERED_TARGET_IS_PRODUCTION_DEGRADED_AND_OUT_OF_SYNC
source_test_commands:
  - [make, test]
  - [corepack, pnpm, --dir, apps/web, test]
deployment_test_commands:
  - [python3, scripts/verify_argocd_release_drift.py, --help]
  - [python3, -m, pytest, tests/gitops_release_guard]
delivery_control:
  source_ci_workflow: CI
  candidate_build:
    enabled: false
    workflow_name: Release
    artifact_name: engineering-control-artifacts
    manifest_file: engineering-artifacts.json
    signer_workflow: gntik-ai/musematic/.github/workflows/deploy.yml
    deny_self_hosted_runners: true
    blocker: MUSEMATIC_CANDIDATE_BUILD_CONTRACT_MISSING
  immutable_promotion:
    enabled: false
    deployment_file: apps/musematic-platform/values.override.yaml
    component_lease: musematic:deploy:staging
    image_repositories:
      control-plane: ghcr.io/gntik-ai/musematic/control-plane
      web: ghcr.io/gntik-ai/musematic/web
      reasoning-engine: ghcr.io/gntik-ai/musematic/reasoning-engine
      runtime-controller: ghcr.io/gntik-ai/musematic/runtime-controller
      sandbox-manager: ghcr.io/gntik-ai/musematic/sandbox-manager
      simulation-controller: ghcr.io/gntik-ai/musematic/simulation-controller
    digest_paths:
      control-plane: images.controlPlane.digest
      web: images.web.digest
      reasoning-engine: images.reasoningEngine.digest
      runtime-controller: images.runtimeController.digest
      sandbox-manager: images.sandboxManager.digest
      simulation-controller: images.simulationController.digest
    blocker: MUSEMATIC_DIGEST_RENDERING_UNSUPPORTED
  staging_flow:
    enabled: true
    kind: argocd-image-updater
    argo_application: musematic-platform
    argo_namespace: argocd
    namespaces: [musematic-platform, platform-data]
    source_ci_workflow: CI
    # main CI is intentionally unset: it does not publish images (deploy.yml does).
    main_ci_workflow: null
    image_workflow: deploy.yml
    release_tag:
      enabled: true
      prefix: v
      bump: patch
    deploy_repository: gntik-ai/musematic-deploy
    deploy_values_file: apps/musematic-platform/values.override.yaml
    deploy_branch: main
    image_repositories:
      - ghcr.io/gntik-ai/musematic/control-plane
      - ghcr.io/gntik-ai/musematic/runtime-controller
      - ghcr.io/gntik-ai/musematic/reasoning-engine
      - ghcr.io/gntik-ai/musematic/simulation-controller
      - ghcr.io/gntik-ai/musematic/sandbox-manager
      - ghcr.io/gntik-ai/musematic/web
    tag_prefix: sha-
    tag_length: 7
    chart_source_repository: https://github.com/gntik-ai/musematic.git
    pin_chart_to_merge: true
    external_secrets_namespace: external-secrets
    external_secrets_deployment: external-secrets
