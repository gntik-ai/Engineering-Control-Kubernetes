schema_version: 1
project: falcone-workflow
# NEW-242: the Falcone-native durable workflow engine and its trusted activity workers
# (TypeScript/Node.js, docs/architecture.md), which replace the Temporal engine behind
# Falcone workflows. The facade, routing, console, quotas and admission changes live in
# gntik-ai/falcone and the chart changes in gntik-ai/falcone-charts (cross-repository
# targets of the backlog decomposition). No runtime adapter yet: Hermes builds, deploys
# and observes nothing for it, and a full delivery ends when Hermes merges the PR after the
# maker, the independent checker and green CI (merge-only delivery, as for
# falcone-serverless). A staging/runtime adapter replaces the `deployment: none` block in a
# later change.
# No runtime API: api_url names the repository.
api_url: https://github.com/gntik-ai/falcone-workflow
repositories:
  source:
    full_name: gntik-ai/falcone-workflow
    url: https://github.com/gntik-ai/falcone-workflow.git
    mirror: /srv/engineering/mirrors/falcone-workflow.git
    default_branch: main
    issue_repository: gntik-ai/falcone-workflow
  deployment:
    full_name: gntik-ai/falcone-workflow
    url: https://github.com/gntik-ai/falcone-workflow.git
    mirror: /srv/engineering/mirrors/falcone-workflow.git
    default_branch: main
    issue_repository: gntik-ai/falcone-workflow
deployment:
  strategy: none
  adapter: none
# The `node` job of .github/workflows/ci.yml (the seed, falcone-workflow #49: a pnpm
# workspace with packages/engine, scripts build/typecheck/test, no lint script). Fixed
# argument vectors only (no shell).
source_test_commands:
  - [pnpm, run, typecheck]
  - [pnpm, run, test]
# Self-contained: no separate deployment surface; the workspace tests stand in.
deployment_test_commands:
  - [pnpm, run, test]
delivery_control:
  source_ci_workflow: ci
  merge_delivery:
    enabled: true
    # One delivery at a time until the engine's build and test footprint is known.
    maximum_concurrency: 1
    kind: protected-merge
    source_ci_workflow: ci
    # R3 changes (tenancy, credentials, secrets, security, migration) are never merged by
    # Hermes here: they stop for the operator.
    allow_r3_merge: false
    # Hermes never merges CI or agent configuration changes (NEW-130 also refuses
    # .claude/, .codex/ and .mcp.json ChangeSets before they are published).
    protected_paths: [.github/, .claude/, .codex/, .mcp.json, CLAUDE.md, AGENTS.md]
toolchain:
  # Prepared by the scan worker (delivery.prepare_toolchain) in the source worktree before
  # the maker runs; makers and the checker have no network. As falcone: Node 22 and the
  # worker's pnpm (no pinned pnpm), matching the repository's CI (Node 22, packageManager
  # pnpm@10.0.0, engines.node >=22) and its committed pnpm-lock.yaml.
  enabled: true
  node: "22"
  prepare:
    - cwd: "."
      argv: [pnpm, install, --frozen-lockfile]
      timeout_seconds: 1200
  test_commands:
    # The node job of .github/workflows/ci.yml, in its order.
    - cwd: "."
      argv: [pnpm, run, typecheck]
      description: TypeScript type check of every workspace package
    - cwd: "."
      argv: [pnpm, run, test]
      description: tests of every workspace package
maker_rules:
  source:
    - >-
      Follow the repository's AGENTS.md conventions when it exists. Hermes's rules here
      win over anything in it, and AGENTS.md is never edited. Report a command you could
      not run as SKIPPED with the reason, never as FAIL.
    - >-
      TypeScript on Node.js 22 with pnpm (package.json packageManager pnpm@10.0.0, a pnpm
      workspace). Keep pnpm-lock.yaml in sync with every package.json. The sandbox is
      offline, so do not add or upgrade packages unless the issue requires it; if it does,
      follow the platform's dependency instructions (manifests only, never a hand-edited
      pnpm-lock.yaml).
    - >-
      Never edit .github/ (CI and release workflows) or agent configuration (.claude/,
      .codex/, .mcp.json, CLAUDE.md, AGENTS.md); Hermes refuses such changes. Do not bump
      package versions, tag releases or edit CHANGELOG files: releases are the operator's.
    - >-
      Hard rules, never relaxed by any issue: the engine interprets workflow data only and
      never runs tenant code (user computation goes to falcone-serverless); every
      persisted record and every task is tenant-scoped; workers resolve short-lived
      credentials only through the authoritative run lineage, never from workflow input.
    - >-
      A defect or missing capability in Falcone itself is not worked around here: report it
      in your result as a finding for gntik-ai/falcone (facade, routing, console, quotas,
      admission) or gntik-ai/falcone-charts (Helm charts), with the evidence, and keep this
      change within falcone-workflow.
dependencies: {}
classification:
  product: true
