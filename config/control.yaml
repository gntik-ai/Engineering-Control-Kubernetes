version: 1
environment: production
api:
  bind: 127.0.0.1
  port: 8740
  authentication: bearer-token-file
  token_file: /etc/engineering-control/env/api.token
  arbitrary_shell: false
temporal:
  target: 127.0.0.1:7233
  namespace: engineering-control
  task_queue: engineering-control
postgresql:
  host: 127.0.0.1
  port: 55432
  database: engineering_control
  credentials_from: /etc/engineering-control/env/database.env
evidence:
  root: /srv/engineering/evidence
  ingest: http://10.10.0.2:8750/v1/evidence
  ingest_authentication: identity-bound-bearer-token-files
  max_artifact_bytes: 33554432
  retention_policy: standard
  redact_before_persist: true
repositories:
  mirrors: /srv/engineering/mirrors
  worktrees: /srv/engineering/worktrees
runtime:
  runs: /srv/engineering/runs
  cache: /srv/engineering/cache
  temporary: /srv/engineering/tmp
  state: /var/lib/engineering-control
  logs: journald
deployments:
  targets: /etc/engineering-control/targets
  default_enabled: false
  preview_mutation_enabled: false
  production_enabled: false
runtime_verification:
  targets: /etc/engineering-control/runtime
  default_enabled: false
  observer_credentials: /etc/engineering-control/env/observer
cleanup:
  execution_enabled: false
  retention_days: 14
  expiry_grace_hours: 24
paid_api_fallback:
  enabled: false
