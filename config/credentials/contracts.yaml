schema_version: 2
secret_values_in_workflow_inputs: false
session_material_persistence: prohibited
github_authentication:
  method: gh-cli-credential-store
  token_files: prohibited
  auth_token_command: prohibited
  allowed_repositories:
    - gntik-ai/falcone
    - gntik-ai/falcone-charts
    - gntik-ai/musematic
    - gntik-ai/musematic-deploy
    - gntik-ai/llmwiki
contracts:
  falcone-superadmin:
    credential_ref: file:/etc/engineering-control/credentials/falcone/superadmin.env
    allowed_keys: [AUTH_METHOD, BASE_URL, USERNAME, PASSWORD, TENANT_ID, WORKSPACE_ID, REALM_OR_ISSUER]
    required_keys: [AUTH_METHOD, BASE_URL, USERNAME, PASSWORD]
    purpose: Create bounded ephemeral Falcone personas on staging and prove their cleanup.
    consumer: browser-runner
    owner: root
    group: browser-runner
    mode: '0640'
    parent_mode: '0750'
  musematic-superadmin:
    credential_ref: file:/etc/engineering-control/credentials/musematic/superadmin.env
    allowed_keys: [AUTH_METHOD, BASE_URL, USERNAME, PASSWORD, TENANT_ID, WORKSPACE_ID, REALM_OR_ISSUER]
    required_keys: [AUTH_METHOD, BASE_URL, USERNAME, PASSWORD]
    purpose: Create bounded ephemeral Musematic personas on staging and prove their cleanup.
    consumer: browser-runner
    owner: root
    group: browser-runner
    mode: '0640'
    parent_mode: '0750'
  registry-read:
    credential_ref: file:/etc/engineering-control/credentials/registry/config.json
    purpose: Resolve candidate and running image digests without publishing images.
    required_scope: packages read for configured image repositories
    consumer: release-runner
  falcone-observer:
    credential_ref: file:/etc/engineering-control/credentials/falcone/observer.kubeconfig
    purpose: Observe Falcone workloads, events, bounded logs, and non-secret configuration.
    required_scope: engineering-observer RoleBinding in in-falcone-staging
    consumer: scan-runner
  musematic-observer:
    credential_ref: file:/etc/engineering-control/credentials/musematic/observer.kubeconfig
    purpose: Observe Musematic workloads, Argo CD state, events, and bounded logs.
    required_scope: engineering-observer RoleBindings in musematic-platform, platform-data, argocd
    consumer: scan-runner
  llmwiki-observer:
    credential_ref: file:/etc/engineering-control/credentials/llmwiki/observer.kubeconfig
    purpose: Observe only the LLMWiki staging namespace and non-secret provenance.
    required_scope: get/list/watch in llmwiki-e2e without Secret, exec, or port-forward access
    consumer: scan-runner
  preview-releaser:
    credential_ref: file:/etc/engineering-control/credentials/PROJECT/preview-releaser.kubeconfig
    purpose: Release only to a pre-created isolated disposable preview target after approval.
    required_scope: namespaced preview release permissions without cluster-wide mutation
    consumer: release-runner
  staging-releaser:
    credential_ref: file:/etc/engineering-control/credentials/PROJECT/staging-releaser.kubeconfig
    purpose: Release only to a manifest-approved non-production staging target after approval.
    required_scope: namespaced staging release permissions without production access
    consumer: release-runner
