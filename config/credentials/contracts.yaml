schema_version: 1
secret_values_in_workflow_inputs: false
contracts:
  github-read:
    credential_refs:
      controller: file:/etc/engineering-control/credentials/github/controller-read.token
      delivery: file:/etc/engineering-control/credentials/github/delivery-read.token
    purpose: Read-only issue and pull-request search for fingerprint deduplication.
    required_scope: repository metadata and issues read for four configured repositories
    consumer: engineering-control and delivery-runner through separate read-only identities
  github-issue-write:
    credential_ref: file:/etc/engineering-control/credentials/github/issues-write.token
    purpose: Publish a confirmed finding after the explicit write-validation checkpoint.
    required_scope: issues write only for an explicitly configured repository allowlist
    consumer: delivery-runner
  github-pr-write:
    credential_ref: file:/etc/engineering-control/credentials/github/pr-write.token
    purpose: Push bounded branches and create pull requests for one ChangeSet.
    required_scope: contents and pull requests write without merge or administration
    consumer: delivery-runner
  registry-read:
    credential_ref: file:/etc/engineering-control/credentials/registry/read.token
    purpose: Resolve candidate and running image digests without publishing images.
    required_scope: packages read for configured image repositories
    consumer: release-runner
  falcone-observer:
    credential_ref: file:/etc/engineering-control/credentials/falcone/observer.kubeconfig
    purpose: Observe Falcone workloads, events, bounded logs, and non-secret configuration.
    required_scope: engineering-observer RoleBinding in in-falcone-staging
    consumer: scan-runner
  musematic-observer:
    credential_ref: file:/etc/engineering-control/credentials/musematic/observer.kubeconfig
    purpose: Observe Musematic workloads, Argo CD state, events, and bounded logs.
    required_scope: engineering-observer RoleBindings in musematic-platform, platform-data, argocd
    consumer: scan-runner
  falcone-browser-personas:
    credential_ref: file:/etc/engineering-control/credentials/falcone/PERSONA.env
    purpose: Authenticate only the named real E2E persona in the isolated browser/API worker.
    required_scope: test identity with manifest-declared product roles
    consumer: browser-runner
  musematic-browser-personas:
    credential_ref: file:/etc/engineering-control/credentials/musematic/PERSONA.env
    purpose: Authenticate only the named real E2E persona in the isolated browser/API worker.
    required_scope: test identity with manifest-declared product roles
    consumer: browser-runner
  preview-releaser:
    credential_ref: file:/etc/engineering-control/credentials/PROJECT/preview-releaser.kubeconfig
    purpose: Release only to a pre-created isolated disposable preview target after approval.
    required_scope: namespaced preview release permissions without cluster-wide mutation
    consumer: release-runner
  staging-releaser:
    credential_ref: file:/etc/engineering-control/credentials/PROJECT/staging-releaser.kubeconfig
    purpose: Release only to a manifest-approved non-production staging target after approval.
    required_scope: namespaced staging release permissions without production access
    consumer: release-runner
