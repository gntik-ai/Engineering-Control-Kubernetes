# Render one copy per explicitly approved namespace; do not bind cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ENGINEERING_IDENTITY
  namespace: TARGET_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ENGINEERING_IDENTITY
  namespace: TARGET_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: ENGINEERING_IDENTITY
    namespace: TARGET_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ENGINEERING_CLUSTER_ROLE
