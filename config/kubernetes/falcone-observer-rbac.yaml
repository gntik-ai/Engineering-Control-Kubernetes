# Manual application only. Engineering Control bootstrap never applies cluster RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-falcone-observer
  namespace: in-falcone-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: engineering-falcone-observer
  namespace: in-falcone-staging
subjects:
  - kind: ServiceAccount
    name: engineering-falcone-observer
    namespace: in-falcone-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: engineering-observer
