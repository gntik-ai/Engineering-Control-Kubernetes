schema_version: 1
project: musematic
personas:
  - id: anonymous
    product_roles: []
    scope: public
    credential_ref: null
    allowed_flows: [public-smoke]
    forbidden_flows: [workspace-read, workspace-crud, admin-health]
    expected_permissions: [public-page.read, public-health.read]
  - id: standard-user
    product_roles: [member, viewer]
    scope: workspace
    credential_ref: file:/etc/engineering-control/credentials/musematic/standard-user.env
    allowed_flows: [valid-login-standard, session-refresh-standard, logout-standard, workspace-read]
    forbidden_flows: [admin-health, workspace-crud]
    expected_permissions: [workspace.read, workspace.summary.read]
  - id: privileged-admin
    product_roles: [workspace_admin, workspace_owner]
    scope: workspace
    credential_ref: file:/etc/engineering-control/credentials/musematic/privileged-admin.env
    allowed_flows: [valid-login-admin, workspace-admin-overview, workspace-crud]
    forbidden_flows: [platform-admin-health]
    expected_permissions: [workspace.manage, workspace.members.manage, workspace.settings.manage]
  - id: platform-administrator
    product_roles: [platform_admin, superadmin]
    scope: platform
    credential_ref: file:/etc/engineering-control/credentials/musematic/platform-administrator.env
    allowed_flows: [valid-login-admin, platform-admin-health, cross-tenant-denial-control]
    forbidden_flows: []
    expected_permissions: [platform.read, platform.manage, cross-tenant.audit]
  - id: developer-operator
    product_roles: [platform_operator, operator]
    scope: operator
    credential_ref: file:/etc/engineering-control/credentials/musematic/developer-operator.env
    allowed_flows: [workspace-read, integration-health]
    forbidden_flows: [workspace-crud, platform-admin-health]
    expected_permissions: [operations.read, incident.read, workload.health.read]
