{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Redacted event projection</p><h2>Live Activity</h2></div>
  <p id="stream-state" class="connection reconnecting" aria-live="polite">Connecting</p>
</section>
<form id="activity-filters" class="filters" role="search">
  <label>Project<select name="project"><option value="">All projects</option>{% for project in projects %}<option>{{ project }}</option>{% endfor %}</select></label>
  <label>Level<select name="level"><option value="">All levels</option><option>DEBUG</option><option>INFO</option><option>WARNING</option><option>ERROR</option><option>CRITICAL</option></select></label>
  <label>Source / worker<input name="source" type="search" maxlength="64"></label>
  <label>Workflow<input name="workflow" type="search" maxlength="240"></label>
  <label>Search<input name="search" type="search" maxlength="200"></label>
  <button id="autoscroll" type="button" aria-pressed="false">Pause autoscroll</button>
</form>
<p id="activity-error" class="alert error hidden" role="alert" aria-live="polite"></p>
<div id="activity-shell" class="table-shell activity-shell" tabindex="0" aria-label="Live activity events">
  <table>
    <thead><tr><th>Time</th><th>Level</th><th>Event</th><th>Source</th><th>Project</th><th>Workflow</th><th>Phase</th><th>Message</th></tr></thead>
    <tbody id="activity-rows"></tbody>
  </table>
</div>
<p id="activity-empty" class="empty hidden">No redacted activity events match these filters.</p>
{% endblock %}
