{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Redacted bounded health snapshots</p><h2>Connections</h2></div>
  <button id="recheck-connections" type="button">Recheck connections</button>
</section>
<p id="connections-freshness" class="muted" aria-live="polite">Loading…</p>
<p id="connections-error" class="alert error hidden" role="alert" aria-live="polite"></p>
<div id="connection-cards" class="health-grid"></div>
<p id="connections-empty" class="empty hidden">No connection snapshots have been published yet. Use Recheck connections to request fixed read-only probes.</p>
{% endblock %}
