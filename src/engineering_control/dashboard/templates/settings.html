{% extends "base.html" %}
{% block content %}
<section class="narrow">
  <p class="eyebrow">Single-password authentication</p>
  <h2>Settings</h2>
  <p>Changing the password immediately invalidates every older dashboard session.</p>
  <form action="/settings/password" method="post" class="stacked-form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current-password">Current password</label>
    <input id="current-password" name="current_password" type="password" maxlength="128" autocomplete="current-password" required>
    <label for="new-password">New password</label>
    <input id="new-password" name="new_password" type="password" minlength="14" maxlength="128" autocomplete="new-password" required aria-describedby="password-help">
    <p id="password-help" class="muted">Use 14–128 characters and choose a different password.</p>
    <label for="confirmation">Confirm new password</label>
    <input id="confirmation" name="confirmation" type="password" minlength="14" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
