{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Coverage-cell projection</p><h2>Audits</h2></div>
  <p id="audit-refreshed" class="muted" aria-live="polite">Loading…</p>
</section>
<form id="audit-filters" class="filters">
  <label>Project<select name="project"><option value="">All projects</option>{% for project in projects %}<option>{{ project }}</option>{% endfor %}</select></label>
  <label>Status<select name="status"><option value="">All statuses</option>{% for status in statuses %}<option>{{ status }}</option>{% endfor %}</select></label>
  <button type="submit">Apply</button>
</form>
<p id="audit-error" class="alert error hidden" role="alert" aria-live="polite"></p>
<div id="audit-list" class="audit-list"></div>
<p id="audit-empty" class="empty hidden">No active or recent audits match these filters.</p>
{% endblock %}
