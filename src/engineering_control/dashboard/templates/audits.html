{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Coverage-cell projection</p><h2>Audits</h2></div>
  <p id="audit-refreshed" class="muted" aria-live="polite">Loading…</p>
</section>
<form id="audit-action-form" class="filters" aria-label="Typed audit operation">
  <label>Audit project<select name="action_project">{% for project in projects %}<option>{{ project }}</option>{% endfor %}</select></label>
  <label>Preset<select name="preset"><option>snapshot</option><option>e2e-smoke</option><option>full-e2e</option><option>security</option><option>ux</option><option>deployment</option><option>documentation</option></select></label>
  <label>Environment<input name="environment" value="staging" pattern="[a-z][a-z0-9-]{0,119}" required></label>
  <label class="checkbox"><input name="publish_findings" type="checkbox"> Publish findings</label>
  <div class="action-row"><button id="plan-audit" type="button">Plan audit</button><button id="start-audit" type="button">Start planned audit</button><button id="documentation-audit" type="button">Documentation audit</button><button id="plan-all-audits" type="button">Plan all projects</button><button id="start-all-audits" type="button">Start all planned projects</button></div>
</form>
<form id="audit-filters" class="filters">
  <label>Project<select name="project"><option value="">All projects</option>{% for project in projects %}<option>{{ project }}</option>{% endfor %}</select></label>
  <label>Status<select name="status"><option value="">All statuses</option>{% for status in statuses %}<option>{{ status }}</option>{% endfor %}</select></label>
  <button type="submit">Apply</button>
</form>
<p id="audit-error" class="alert error hidden" role="alert" aria-live="polite"></p>
<div id="audit-list" class="audit-list"></div>
<p id="audit-empty" class="empty hidden">No active or recent audits match these filters.</p>
{% endblock %}
