{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Bounded, redacted CLI-visible output</p><h2>Execution transcript</h2></div>
  <p id="transcript-state" class="connection reconnecting" aria-live="polite">Connecting</p>
</section>
<div id="execution-detail" data-execution-id="{{ execution_id }}">
  <p id="execution-error" class="alert error hidden" role="alert"></p>
  <section id="execution-identity" class="panel"></section>
  <div class="transcript-tools">
    <button id="transcript-older" type="button">Load older</button>
    <label>Search loaded transcript<input id="transcript-search" type="search" maxlength="200"></label>
    <button id="transcript-follow" type="button" aria-pressed="true">Following tail</button>
    <button id="transcript-copy" type="button">Copy selected redacted lines</button>
  </div>
  <div id="transcript-badges" class="badge-row" aria-live="polite"></div>
  <ol id="transcript-lines" class="transcript" tabindex="0" aria-label="Read-only agent transcript"></ol>
</div>
{% endblock %}
