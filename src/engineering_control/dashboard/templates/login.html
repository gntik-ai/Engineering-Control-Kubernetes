<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ title }} · Hermes Engineering</title>
  <link rel="icon" href="/login?asset=icon">
  <link rel="stylesheet" href="/login?asset=css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">Hermes</p>
    <h1>Engineering Operations</h1>
    <p class="muted">Enter the dashboard password. There is no username.</p>
    {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
    <form action="/login" method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next_path" value="{{ next_path }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
