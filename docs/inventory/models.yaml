discrepancies:
- 'Configured ≠ observed cannot be checked for any step: the platform discards the CLI-reported model (claude/client.py:261-276,
  codex/client.py:195-214; no model column in db/models.py:168-185, 267-280).'
- Claude model pin covers only spec and checker; reproduce, release review, runtime review, product review and every Claude
  fallback run on the claude-runner default (unknown). Release review uses the checker's provider but not its model pin (metadata.py:5183-5200
  has no `model=`).
- 'History mixes pre-pin runs: checker 28 and spec 54 dispatches before 2026-09-25 had no `--model`; all observability canaries
  (≤ 2026-09-17) and codex runs before NEW-36 (2026-09-23) had no codex `--model`. Aggregates in Part 4 are split by dispatched
  model.'
- The adapter environment filter does not remove `ANTHROPIC_MODEL` / `CLAUDE_CODE_EFFORT_LEVEL` (process.py:63-93); if set
  in the unreadable worker env files they would silently override `--model` / `--effort`. UNVERIFIED.
- '`ENGINEERING_CODEX_MODEL` / `ENGINEERING_CLAUDE_*_MODEL` could override the code defaults from env files — UNVERIFIED.
  For the Claude pins the dispatched requests confirm the controller value is `claude-opus-5-5`; for codex the dispatched
  request is `null` and the effective value is set inside the codex worker, so it is not visible.'
- '`estimated_cost` is always null for both engines (adapters never fill it), so cost cannot be reported.'
- 'Deployed release (`a9c8c62`) vs repository HEAD (`acd3d95`): no difference in model/effort code or config defaults.'
- 'Security note found while reading units: `systemctl show`/`systemctl cat` (world-readable) expose `ENGINEERING_EVIDENCE_INGEST_TOKEN`
  on the role-worker units and `ENGINEERING_API_TOKEN` on `hermes-gateway.service` as inline `Environment=` values (values
  not printed here).'
- 'Hermes: `agent.reasoning_effort: medium` (~/.hermes/config.yaml:12) is never sent on the codex app-server path — `thread/start`
  carries only cwd/sandbox/approvalPolicy/model (/opt/hermes-agent/releases/fecf78726c170f1f5fdadec7156c52ea3de4651b/source/agent/transports/codex_app_server_session.py:436-445)
  and `turn/start` only threadId/input/outputSchema (/opt/hermes-agent/releases/fecf78726c170f1f5fdadec7156c52ea3de4651b/source/agent/transports/codex_app_server_session.py:801-806);
  effort therefore comes from the running identity''s `~/.codex/config.toml`, which for user hermes is `model_reasoning_effort
  = "xhigh"` (~/.codex/config.toml:2). Gateway identity''s value UNVERIFIED.'
- 'Hermes: user hermes''s `~/.codex/config.toml:1` sets `model = "gpt-5.6-sol"` while Hermes passes `gpt-5.6-terra` per thread
  (thread model wins for the main loop); anything that runs that codex without a thread model would use `gpt-5.6-sol`.'
- 'Hermes: controller codex for user hermes is `codex-cli 0.153.4` (~/.local/bin/codex), the worker CLI is 0.157.0 — two versions
  in use.'
- 'Hermes: the engineering profile has no `openai_runtime`, so a run under that profile would use the HTTP-subscription path
  (chatgpt.com backend) instead of the CLI app-server.'
