discrepancies:
- '**Installed hook ≠ repository hook.** `~/.hermes/hooks/engineering-control/handler.py` still has `/loop delivery-candidate`
  and `/loop approve-delivery` (API actions removed → 404) and `/loop r3-candidate|approve-r3` hard-wired to `musematic source
  1119`; the repo copy removed/generalized them (NEW-01, `docs/GO-STATUS.md:132-145`: "written, tested, not deployed"). The
  hook is installed only by `scripts/bootstrap-controller.sh:226-242`, which the release deploy script does not run. Which
  copy the live gateway (`/var/lib/hermes-gateway/home`) uses: UNVERIFIED.'
- '**`/help` and `/whoami` are denied** by the hook (`Unknown engineering command denied.`) although Hermes''s policy floor
  allows them; there is no in-chat help. Six engineering names shadow Hermes built-ins (`/approve`, `/pause`, `/resume`, `/rollback`,
  `/status`, `/usage`) — on Telegram they always mean the engineering command.'
- '**Usage strings disagree with the grammar**: `/loop` with no args lists `import|inventory|plan|queue|issue|approval-candidate|approve|start|status|pause|resume|cancel|skip|retry`
  but not `issue-locate`, `issue-start`, `global-start`, `diagnose`, `tail`, `nudge`, `retry-issue`, `r3-candidate`, `approve-r3`
  (H:749-753). `/loop start` accepts `plan-only|preview|staging` as mode (H:1030) but the typed command only allows `source-pr|full-delivery`,
  so those fail at the API.'
- '**`/loop nudge` is effectively a no-op** (sends `retry` with value `operator-nudge`, which no wait condition matches).'
- '**Write-policy alert gives CLI, not Telegram, commands** (`engineering-ctl backlog-approval-candidate … --max-items 1`,
  `engineering-ctl backlog-approve …`, activities/engineering.py:1934-1937); the Telegram equivalents are `/loop approval-candidate`
  and `/loop approve` with positional `max-items`.'
- '**No Telegram command** for: releasing write-policy ownership early (`POST /v1/backlogs/{id}/release-ownership`, CLI `backlog-release-ownership`),
  `pause_after_current` / `stop_after_current` (bus actions available to the dashboard), `refresh_connections` (dashboard/CLI
  `recheck-connections`), delivery reconciliation, preview/staging deployment preparation, runtime verification, fetching
  an export body (`operation-export`), R3 via dashboard only in the installed copy for non-1119 issues.'
- '**Dashboard vs Telegram**: the dashboard submits typed bus commands after password re-authentication; Telegram calls a
  mix of `/v1/commands` and direct REST routes (enhancement approve/reject go to REST in Telegram but are bus commands on
  the dashboard).'
- '**`/approve` / `/reject`** target Preview/Staging/Recovery approval waits; the current delivery path (StagingGitOpsDelivery)
  has no approval gate, so these only matter for the legacy candidate pipeline and recovery.'
- '**`/loop issue-start` fixes maximum risk at R2** (H:821-825): R3 issues (e.g. falcone #1012–#1016, falcone-charts #22)
  fail preflight until an R3 approval exists; there is no per-run risk, model or effort override in any command.'
