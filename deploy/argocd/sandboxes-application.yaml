# The Argo CD application for the namespace the sandboxes run in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engineering-control-sandboxes
  namespace: argocd
spec:
  project: engineering-control
  source:
    repoURL: git@github.com:gntik-ai/Engineering-Control-Kubernetes.git
    targetRevision: claude/determined-cray-5v3lhn
    path: deploy/sandboxes
  destination:
    server: https://kubernetes.default.svc
    namespace: engineering-control-sandboxes
