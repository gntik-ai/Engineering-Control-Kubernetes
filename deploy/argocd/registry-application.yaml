# Creates the image pull Secret from two parameters held in Argo CD (not in this
# repository): helm parameters `username` and `token`, set in the Argo CD UI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engineering-control-registry
  namespace: argocd
spec:
  project: engineering-control
  source:
    repoURL: git@github.com:gntik-ai/Engineering-Control-Kubernetes.git
    targetRevision: claude/determined-cray-5v3lhn
    path: deploy/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: engineering-control
