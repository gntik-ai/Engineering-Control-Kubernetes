# Nothing in this namespace is reachable and nothing in it reaches anything, until a rule
# says otherwise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-everything
  namespace: engineering-control-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# A step that has to reach its provider, GitHub or a package registry carries the label
# engineering-control/egress: internet. It may then open connections to the platform's
# proxy (deploy/base/egress.yaml) and to nothing else: no name server, no pod or service of
# this cluster, no node, no private network, and no public address either. The proxy opens
# tunnels to the hosts on its list only, so "the internet" for a sandbox is that list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-internet
  namespace: engineering-control-sandboxes
spec:
  podSelector:
    matchLabels:
      engineering-control/egress: internet
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: engineering-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: engineering-control
              app.kubernetes.io/component: egress
      ports:
        - protocol: TCP
          port: 8888
---
# The sandbox of a turn of the supervisor carries the label engineering-control/tools:
# supervisor. It may, besides the proxy, reach the platform's tool service and nothing
# else of the control plane. Every call there needs the token of that turn.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supervisor-tools
  namespace: engineering-control-sandboxes
spec:
  podSelector:
    matchLabels:
      engineering-control/tools: supervisor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: engineering-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: engineering-control
              app.kubernetes.io/component: tools
      ports:
        - protocol: TCP
          port: 8790
