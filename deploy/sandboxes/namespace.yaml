apiVersion: v1
kind: Namespace
metadata:
  name: engineering-control-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # A sandbox runs code the platform does not control. The cluster itself refuses any pod
    # here that is not unprivileged in every respect the "restricted" level names: no root,
    # no added capability, no privilege escalation, no host namespace or host path.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
