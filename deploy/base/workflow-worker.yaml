# Runs the workflows and the controller-side activities. It has no listener.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-control-workflow-worker
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: workflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: workflow-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control
        app.kubernetes.io/component: workflow-worker
    spec:
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: workflow-worker
          image: engineering-control
          command: ["engineering-worker"]
          envFrom:
            - configMapRef:
                name: engineering-control-settings
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: password
            - name: ENGINEERING_DATABASE_URL
              value: postgresql+psycopg://$(DATABASE_USER):$(DATABASE_PASSWORD)@engineering-control-postgres-rw:5432/engineering_control
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/engineering-control
              readOnly: true
            - name: temporal-ca
              mountPath: /var/run/secrets/engineering-control-temporal
              readOnly: true
            - name: state
              mountPath: /var/lib/engineering-control
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: engineering-control-secrets
            defaultMode: 0440
        # The certificate authority only; the key of the server certificate is not mounted.
        - name: temporal-ca
          secret:
            secretName: engineering-control-temporal-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
