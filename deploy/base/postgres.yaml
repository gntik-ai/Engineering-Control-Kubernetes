# The platform's own PostgreSQL, run by the CloudNativePG operator already on the cluster.
# The operator creates the Secret engineering-control-postgres-app (username, password).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engineering-control-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # On the cluster's Ubuntu 26.04 nodes (kernel 7.0) PostgreSQL cannot signal its own
  # processes and never finishes starting ("could not signal for checkpoint: Permission
  # denied"); the same error keeps two databases of another application down there. It
  # starts normally on the Ubuntu 24.04 node, so the database is placed on that node until
  # the nodes are fixed. Remove this block then.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: mus-srv-0
  bootstrap:
    initdb:
      database: engineering_control
      owner: engineering_control
      encoding: UTF8
      dataChecksums: true
  # No storage class is named: the cluster's default is used.
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
