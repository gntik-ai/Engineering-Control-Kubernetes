# The platform's own PostgreSQL, run by the CloudNativePG operator already on the cluster.
# The operator creates the Secret engineering-control-postgres-app (username, password).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engineering-control-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: engineering_control
      owner: engineering_control
      encoding: UTF8
      dataChecksums: true
  # Never on the node reserved for sandboxes (see deploy/README.md).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: engineering-control/sandbox
                operator: DoesNotExist
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["aibot"]
  # No storage class is named: the cluster's default is used.
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
