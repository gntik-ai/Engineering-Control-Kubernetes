# Non-secret settings shared by every control-plane process.
apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-control-settings
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  ENGINEERING_ENVIRONMENT: cluster
  # Listeners are on the pod interface; network policy decides who may reach them.
  ENGINEERING_NETWORK_BOUNDARY: cluster
  ENGINEERING_API_HOST: 0.0.0.0
  # The console reads the admission state of the API through its Service.
  ENGINEERING_API_SERVICE_NAME: engineering-control-api
  ENGINEERING_DASHBOARD_HOST: 0.0.0.0
  ENGINEERING_EVIDENCE_INGEST_HOST: 0.0.0.0
  # The ingress controller connects from the pod network; only such connections may say
  # which client address a sign-in attempt is counted against.
  ENGINEERING_DASHBOARD_TRUSTED_PROXY_NETWORKS: '["10.42.0.0/16"]'
  ENGINEERING_API_TOKEN_FILE: /var/run/secrets/engineering-control/api.token
  ENGINEERING_DASHBOARD_SESSION_KEY_FILE: /var/run/secrets/engineering-control/session.key
  ENGINEERING_EVIDENCE_INGEST_TOKEN_FILE: /var/run/secrets/engineering-control/evidence-ingest.token
  ENGINEERING_EVIDENCE_INGEST_TOKEN_DIRECTORY: /var/run/secrets/engineering-control
  ENGINEERING_TEMPORAL_TARGET: engineering-control-temporal:7233
  ENGINEERING_TEMPORAL_NAMESPACE: engineering-control
