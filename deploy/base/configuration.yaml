# Non-secret settings shared by every control-plane process.
apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-control-settings
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  ENGINEERING_ENVIRONMENT: cluster
  # Listeners are on the pod interface; network policy decides who may reach them.
  ENGINEERING_NETWORK_BOUNDARY: cluster
  ENGINEERING_API_HOST: 0.0.0.0
  # The console reads the admission state of the API through its Service.
  ENGINEERING_API_SERVICE_NAME: engineering-control-api
  ENGINEERING_DASHBOARD_HOST: 0.0.0.0
  ENGINEERING_EVIDENCE_INGEST_HOST: 0.0.0.0
  # The ingress controller connects from a node address (see network-policy.yaml); only
  # such connections may say which client address a sign-in attempt is counted against.
  ENGINEERING_DASHBOARD_TRUSTED_PROXY_NETWORKS: >-
    ["10.0.1.1/32", "10.42.0.0/32", "100.64.0.7/32", "10.42.3.0/32",
    "100.64.0.6/32", "10.42.5.0/32", "100.64.0.5/32", "10.42.17.0/32"]
  ENGINEERING_API_TOKEN_FILE: /var/run/secrets/engineering-control/api.token
  ENGINEERING_DASHBOARD_SESSION_KEY_FILE: /var/run/secrets/engineering-control/session.key
  ENGINEERING_EVIDENCE_INGEST_TOKEN_FILE: /var/run/secrets/engineering-control/evidence-ingest.token
  ENGINEERING_EVIDENCE_INGEST_TOKEN_DIRECTORY: /var/run/secrets/engineering-control
  # The GitHub App "Engineering Control" of the organisation, installed on the repositories
  # the platform works on. Identifiers only; the private key and the client secret are in
  # the Secret engineering-control-github-app, created by the administrator.
  ENGINEERING_GITHUB_APP_ID: "5724836"
  ENGINEERING_GITHUB_APP_CLIENT_ID: Iv23ctEXJNig6ZErLZsS
  ENGINEERING_GITHUB_APP_INSTALLATION_ID: "181163547"
  ENGINEERING_GITHUB_APP_PRIVATE_KEY_FILE: /var/run/secrets/engineering-control-github-app/private-key.pem
  # The chat channel answers this Telegram account only. The bot's token is in the Secret
  # engineering-control-telegram, created by the administrator.
  ENGINEERING_TELEGRAM_ADMINISTRATOR_ID: "685699815"
  # Where the sandboxes run and the sign-ins of subscription accounts are stored
  # (deploy/sandboxes). Only the console has an identity that may write there.
  ENGINEERING_SANDBOX_NAMESPACE: engineering-control-sandboxes
  # Steps in sandboxes at the same time. The node takes four agent steps of 6 GiB each;
  # deploy/sandboxes/quota.yaml is the cluster's ceiling behind this number.
  ENGINEERING_SANDBOX_PARALLEL_STEPS: "4"
  # The sandboxes' way out (deploy/base/egress.yaml): where the proxy listens, and where
  # the launcher tells a sandbox to find it. A sandbox has no name server, so the launcher
  # looks this name up and hands the sandbox the address.
  ENGINEERING_SANDBOX_EGRESS_HOST: 0.0.0.0
  ENGINEERING_SANDBOX_EGRESS_PROXY: http://engineering-control-egress:8888
  ENGINEERING_TEMPORAL_TARGET: engineering-control-temporal:7233
  ENGINEERING_TEMPORAL_NAMESPACE: engineering-control
  # Temporal is reached over TLS: the server must show a certificate for this name, signed
  # by the platform's certificate authority (deploy/base/certificates.yaml).
  ENGINEERING_TEMPORAL_TLS_CA_FILE: /var/run/secrets/engineering-control-temporal/ca.crt
  ENGINEERING_TEMPORAL_TLS_SERVER_NAME: engineering-control-temporal
