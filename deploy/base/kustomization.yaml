# The control plane: databases, bootstrap, migrations, Temporal, API, console, evidence
# ingest, notifier, workflow worker and the console's public route. The scheduler and the
# role workers are not here yet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: engineering-control
resources:
  - namespace.yaml
  - configuration.yaml
  - access.yaml
  - network-policy.yaml
  - certificates.yaml
  - postgres.yaml
  - storage.yaml
  - bootstrap-jobs.yaml
  - temporal.yaml
  - console.yaml
  - evidence-ingest.yaml
  - notifier.yaml
  - api.yaml
  - workflow-worker.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: engineering-control
images:
  # Built and pushed by CI for every commit, tagged with the commit it was built from.
  # Deploying a new version is changing this one line.
  - name: engineering-control
    newName: ghcr.io/gntik-ai/engineering-control-kubernetes
    newTag: 294cdc2d9198d0257e16f11564efec142981b795
