# The platform: its database, bootstrap and migrations, the console, the launcher, the
# sandboxes' proxy, the supervisor's tools, the chat channel and the console's public
# route.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: engineering-control
resources:
  - namespace.yaml
  - configuration.yaml
  - access.yaml
  - network-policy.yaml
  - postgres.yaml
  - bootstrap-jobs.yaml
  - console.yaml
  - launcher.yaml
  - egress.yaml
  - tools.yaml
  - gateway.yaml
  - ranker.yaml
  - chat.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: engineering-control
images:
  # Built and pushed by CI for every commit, tagged with the commit it was built from.
  # Deploying a new version is changing this one line.
  - name: engineering-control
    newName: ghcr.io/gntik-ai/engineering-control-kubernetes
    newTag: 51dfc5fed988392a1738cef3b868afb2075d2662
# The image the sandboxes run is a setting of the launcher, not a container of a manifest,
# so it is pinned here by a patch: always to the same commit as the image above.
patches:
  - target:
      kind: Deployment
      name: engineering-control-launcher
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: ghcr.io/gntik-ai/engineering-control-kubernetes-sandbox:51dfc5fed988392a1738cef3b868afb2075d2662
