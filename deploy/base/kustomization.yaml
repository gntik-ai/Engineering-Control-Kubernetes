# The control plane: databases, bootstrap, migrations, Temporal, API, console, evidence
# ingest, notifier, workflow worker, launcher and the console's public route. The scheduler
# and the role workers are not here yet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: engineering-control
resources:
  - namespace.yaml
  - configuration.yaml
  - access.yaml
  - network-policy.yaml
  - certificates.yaml
  - postgres.yaml
  - storage.yaml
  - bootstrap-jobs.yaml
  - temporal.yaml
  - console.yaml
  - launcher.yaml
  - evidence-ingest.yaml
  - notifier.yaml
  - api.yaml
  - workflow-worker.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: engineering-control
images:
  # Built and pushed by CI for every commit, tagged with the commit it was built from.
  # Deploying a new version is changing this one line.
  - name: engineering-control
    newName: ghcr.io/gntik-ai/engineering-control-kubernetes
    newTag: aa9b6bf9ce4e9bb49a65fad002fce51c7720acb0
# The image the sandboxes run is a setting of the launcher, not a container of a manifest,
# so it is pinned here by a patch: always to the same commit as the image above.
patches:
  - target:
      kind: Deployment
      name: engineering-control-launcher
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: ghcr.io/gntik-ai/engineering-control-kubernetes-sandbox:aa9b6bf9ce4e9bb49a65fad002fce51c7720acb0
