# One-time, expiring maintenance request for the independent OpenAI connection review.
apiVersion: batch/v1
kind: Job
metadata:
  name: hold-falcone-connection-reviews-20261120
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control-bootstrap
        app.kubernetes.io/component: review-maintenance
    spec:
      restartPolicy: Never
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: hold-connections
          image: engineering-control
          command: ["python", "-c"]
          args:
            - |
                import json
                import os
                import time
                from datetime import UTC, datetime
                from uuid import uuid4
                from sqlalchemy import func, select
                from engineering_control.dashboard.repository import DashboardRepository
                from engineering_control.db.models import (
                    ConnectionFinding, DashboardEvent, ModelBatch, PlanningReview, ProjectConnection,
                    ProjectRecord, SandboxRun, StoryIssueCoverage, WorkspaceImport, WorkspaceModelUsage,
                )
                repo = DashboardRepository(os.environ["ENGINEERING_DATABASE_URL"])
                event = "operations.hold_falcone_openai_connections_20261120"
                start = datetime.now(UTC)
                if start >= datetime.fromisoformat("2026-11-20T15:00:00+00:00"):
                    print("Expired operator request."); raise SystemExit(0)
                def log(kind, **fields):
                    print(json.dumps({"incident":kind, **fields},sort_keys=True,default=str),flush=True)
                with repo.sessions.begin() as db:
                    owner = db.scalar(select(ProjectRecord).where(ProjectRecord.name=="falcone", func.lower(ProjectRecord.source_repository)=="gntik-ai/falcone",ProjectRecord.archived_at.is_(None)).with_for_update())
                    if not owner:
                        raise RuntimeError("The identified project is unavailable.")
                    if db.scalar(select(DashboardEvent.id).where(DashboardEvent.event_type==event).limit(1)):
                        print("Already handled."); raise SystemExit(0)
                    held = []
                    for c in db.scalars(select(ProjectConnection).where(ProjectConnection.owner_id==owner.id,
                        ProjectConnection.provider=="openai", ProjectConnection.model=="gpt-6.2-sol",
                        ProjectConnection.archived_at.is_(None)).with_for_update()):
                        peer = db.get(ProjectRecord, c.second_id if c.first_id==owner.id else c.first_id)
                        findings=db.execute(select(func.count(),func.max(ConnectionFinding.updated_at)).where(ConnectionFinding.connection_id==c.id,ConnectionFinding.origin=="model")).one()
                        log("connection_hold",owner=owner.name,peer=peer.name if peer else None,previous=c.status,model=c.model,last_analysis=c.last_checked,model_findings=findings[0],last_finding=findings[1],state="paused")
                        if c.status!="paused":
                            c.status,c.lease="paused",None
                            c.progress={**c.progress,"run_id":str(uuid4())}
                        held.append(str(c.id))
                    db.add(DashboardEvent(occurred_at=start,level="INFO",event_type=event,source="gitops",project=owner.name,entity_type="project",entity_id=owner.name,message="Stopped the independent OpenAI project connection review until administrator resume.",metadata_json={"connections":held}))
                    for project in db.scalars(select(ProjectRecord).where(ProjectRecord.name.in_(("falcone","falcone-serverless")))):
                        w=db.get(WorkspaceImport,project.id)
                        cp=db.scalar(select(func.count()).select_from(StoryIssueCoverage).where(StoryIssueCoverage.project_id==project.id))
                        log("review_sources",project=project.name,coverage_model=w.model if w else None,coverage_stage=w.stage if w else None,coverage_state=(w.progress.get("coverage_run") or {}).get("state") if w else None,last_wizard_update=w.updated_at if w else None,coverage_story_checkpoints=cp,automatic_review_model=project.planning_model,automatic_paused=bool(project.planning_reviews_paused_at))
                        if project.planning_reviews_paused_at:
                            later={}
                            for when,usage in db.execute(select(WorkspaceModelUsage.recorded_at,WorkspaceModelUsage.usage).where(WorkspaceModelUsage.project_id==project.id,WorkspaceModelUsage.recorded_at>=project.planning_reviews_paused_at).order_by(WorkspaceModelUsage.recorded_at)):
                                if usage.get("provider") not in ("openai","anthropic"): continue
                                key=(usage.get("provider"),usage.get("model")); group=later.setdefault(key,{"requests":0,"tokens":0})
                                group["requests"]+=1;group["tokens"]+=int(usage.get("tokens") or ((usage.get("input") or 0)+(usage.get("output") or 0)));group["last"]=when
                            for (provider,model),amounts in later.items():
                                log("usage_after_automatic_stop",project=project.name,provider=provider,model=model,**amounts)
                        recent=db.execute(select(DashboardEvent.occurred_at, DashboardEvent.event_type).where(DashboardEvent.entity_id==project.name,DashboardEvent.event_type.in_(("workspace.coverage_requested","workspace.import_stopped","workspace.import_resumed","workspace.connection_analysis_requested","workspace.planning_reviews_paused","workspace.coverage_paused"))).order_by(DashboardEvent.occurred_at.desc()).limit(8))
                        for at,k in recent:log("audit",project=project.name,event=k,at=at)
                # Observe through several worker ticks after the transaction commits.
                for _ in range(3):
                    time.sleep(20)
                with repo.sessions() as db:
                    billed=db.scalar(select(func.count()).select_from(WorkspaceModelUsage).where(WorkspaceModelUsage.recorded_at>=start,WorkspaceModelUsage.usage["provider"].as_string().in_(("openai","anthropic"))))
                    active=db.scalar(select(func.count()).select_from(PlanningReview).where(PlanningReview.status=="running"))
                    open_runs=db.scalar(select(func.count()).select_from(SandboxRun).where(SandboxRun.state.in_(("queued","running","waiting"))))
                    batches=db.scalar(select(func.count()).select_from(ModelBatch).where(ModelBatch.state.not_in(("ended","failed"))))
                    resumed=db.scalar(select(func.count()).select_from(ProjectConnection).where(ProjectConnection.owner_id==owner.id,ProjectConnection.provider=="openai",ProjectConnection.model=="gpt-6.2-sol",ProjectConnection.archived_at.is_(None),ProjectConnection.status!="paused"))
                    last=db.scalar(select(func.max(WorkspaceModelUsage.recorded_at)).where(WorkspaceModelUsage.usage["provider"].as_string().in_(("openai","anthropic"))))
                    log("verified",at=datetime.now(UTC),latest_metered_response=last,new_metered_responses=billed,running_automatic_reviews=active,open_sandbox_runs=open_runs,outstanding_batches=batches,unpaused_matching_connections=resumed)
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: password
            - name: ENGINEERING_DATABASE_URL
              value: postgresql+psycopg://$(DATABASE_USER):$(DATABASE_PASSWORD)@engineering-control-postgres-rw:5432/engineering_control
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
