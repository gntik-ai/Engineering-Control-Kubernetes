# The console and sign-in page (the dashboard service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-control-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: engineering-control-console
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: console
          image: engineering-control
          command: ["engineering-dashboard"]
          ports:
            - name: http
              containerPort: 8750
          envFrom:
            - configMapRef:
                name: engineering-control-settings
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: password
            - name: ENGINEERING_DATABASE_URL
              value: postgresql+psycopg://$(DATABASE_USER):$(DATABASE_PASSWORD)@engineering-control-postgres-rw:5432/engineering_control
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/engineering-control
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/engineering-control-github-app
              readOnly: true
            - name: cluster
              mountPath: /var/run/secrets/engineering-control-cluster
              readOnly: true
            - name: state
              mountPath: /var/lib/engineering-control
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: engineering-control-secrets
            defaultMode: 0440
        # The GitHub App's private key, from the Secret the administrator creates. Only the
        # key: the app's client secret is not mounted. Without the Secret the console still
        # starts and asks for the repository of a new project to be typed.
        - name: github-app
          secret:
            secretName: engineering-control-github-app
            optional: true
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        # The console's identity towards the cluster, for one purpose: storing the sign-in
        # of a subscription account in the sandbox namespace. A token valid for an hour,
        # renewed by the kubelet, readable by the console's group only.
        - name: cluster
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-control-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: console
spec:
  selector:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 8750
      targetPort: http
