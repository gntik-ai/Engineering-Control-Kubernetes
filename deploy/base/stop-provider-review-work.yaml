# One-time, expiring maintenance request for the active OpenAI and Anthropic review work.
apiVersion: batch/v1
kind: Job
metadata:
  name: stop-provider-review-work-20261120
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control-bootstrap
        app.kubernetes.io/component: review-maintenance
    spec:
      restartPolicy: Never
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: stop-reviews
          image: engineering-control
          command: ["python", "-c"]
          args:
            - |
                """One-time, state-preserving stop for chargeable review workers."""
                import json
                import os
                from collections import Counter
                from datetime import UTC, datetime, timedelta

                from sqlalchemy import func, select
                from engineering_control.dashboard.planning_analysis import selection
                from engineering_control.dashboard.repository import DashboardRepository
                from engineering_control.dashboard.workspace_import import review_control
                from engineering_control.dashboard.project_records import ProjectConflict
                from engineering_control.db.models import (
                    DashboardEvent, EpicExecutionPlan, Evaluation, ModelBatch, PlanningReview, ProjectConnection,
                    ProjectRecord, SandboxRun, WorkQueue, WorkspaceImport, WorkspaceModelUsage,
                )

                now = datetime.now(UTC)
                request = "operations.provider_workers_stop_20261120"
                expires = datetime.fromisoformat("2026-11-20T15:00:00+00:00")
                if now >= expires:
                    print("Request expired.")
                    raise SystemExit(0)
                repo = DashboardRepository(os.environ["ENGINEERING_DATABASE_URL"])
                def affected(provider, model):
                    return (provider or "").lower() in {"anthropic","openai","chatgpt","claude","codex"} or (model or "").lower().startswith(("claude-", "gpt-", "codex-"))
                def log(kind, **fields):
                    print(json.dumps({"incident":kind, **fields},sort_keys=True),flush=True)
                with repo.sessions() as db:
                    if db.scalar(select(DashboardEvent.id).where(DashboardEvent.event_type == request).limit(1)):
                        print("Already handled.")
                        raise SystemExit(0)
                    projects = {r.id:r.name for r in db.scalars(select(ProjectRecord).where(ProjectRecord.archived_at.is_(None)))}
                    usage = {}
                    for pid, at, data in db.execute(select(WorkspaceModelUsage.project_id, WorkspaceModelUsage.recorded_at, WorkspaceModelUsage.usage).where(WorkspaceModelUsage.recorded_at >= now-timedelta(hours=3)).order_by(WorkspaceModelUsage.recorded_at)):
                        if not affected(data.get("provider"), data.get("model")): continue
                        k=(projects.get(pid,"archived"),data.get("provider"),data.get("model"))
                        item=usage.setdefault(k,{"requests":0,"tokens":0,"first":at.isoformat()})
                        item["requests"]+=1
                        item["tokens"]+=int(data.get("tokens") or ((data.get("input") or 0)+(data.get("output") or 0)))
                        item["last"]=at.isoformat()
                    for (name,provider,model), values in usage.items(): log("metered", project=name,provider=provider,model=model,**values)
                    for kind, model, state in (("sandbox",SandboxRun,"state"),("evaluation",Evaluation,"state"),("provider_batch",ModelBatch,"state"),("execution_plan",EpicExecutionPlan,"status"),("execution_queue",WorkQueue,"state")):
                        col=getattr(model,state)
                        counts=dict(db.execute(select(col,func.count()).group_by(col)).all())
                        log(kind,counts=counts)
                for pid,name in projects.items():
                    with repo.sessions() as db:
                        project=db.get(ProjectRecord,pid)
                        wizard=db.get(WorkspaceImport,pid)
                        provider,model=selection(project,wizard)
                        counts=dict(db.execute(select(PlanningReview.status,func.count()).where(PlanningReview.project_id==pid).group_by(PlanningReview.status)).all())
                        pause_time=project.planning_reviews_paused_at
                        recent=dict(db.execute(select(PlanningReview.status,func.count()).where(PlanningReview.project_id==pid, PlanningReview.updated_at>=now-timedelta(hours=3)).group_by(PlanningReview.status)).all())
                        state=(wizard.progress.get("coverage_run") or {}).get("state") if wizard else None
                        job=(wizard.progress.get("operation") or {}).get("state") if wizard else None
                        scan=(wizard.progress or {}).get("scan_state") if wizard else None
                        control=review_control(wizard) if wizard else None
                        wizard_affected=wizard and affected(wizard.provider,wizard.model)
                        scanning=bool(wizard and (wizard.lease or state=="running" or job=="running" or scan=="running"))
                        log("review_before",project=name,provider=provider,model=model,queue=counts,recent=recent,
                            paused_at=pause_time.isoformat() if pause_time else None,project_paused=bool(project.paused_at),
                            coverage=state,operation=job,scan=scan)
                    if affected(provider,model) and not pause_time and (counts.get("queued") or counts.get("running")):
                        repo.planning_analysis.pause_queue(name,True)
                        log("stopped",project=name,worker="automatic planning reviews")
                    if wizard_affected and scanning and control:
                        try:
                            repo.workspace_imports._change_review(name,control,resume=False)
                            log("stopped",project=name,worker="project coverage or repository review")
                        except ProjectConflict:
                            log("already ended or stopped",project=name,worker="repository review")
                    with repo.sessions.begin() as db:
                        plans=db.scalars(select(EpicExecutionPlan).join(WorkQueue,WorkQueue.id==EpicExecutionPlan.queue_id).where(WorkQueue.project_id==pid,WorkQueue.state=="draft",EpicExecutionPlan.status.in_(("queued","analyzing"))).with_for_update(of=EpicExecutionPlan))
                        for plan in plans:
                            if affected(provider,model):
                                plan.status,plan.lease,plan.detail="failed",None,"Stopped by administrator. Replan this queue to resume."
                                log("stopped",project=name,worker="execution planning",queue=str(plan.queue_id))
                    with repo.sessions() as db:
                        connections=[(c.id,c.status,c.provider,c.model,str(c.progress.get("run_id") or c.updated_at.isoformat())) for c in db.scalars(select(ProjectConnection).where(ProjectConnection.owner_id==pid, ProjectConnection.archived_at.is_(None)))]
                    for cid,status,cp,cm,control in connections:
                        log("connection",project=name,state=status,provider=cp,model=cm)
                        if affected(cp,cm) and status in ("running","queued"):
                            try:
                                repo.connections.pause_analysis(name,cid,control,True)
                                log("stopped",project=name,worker="connection review")
                            except ProjectConflict:
                                log("already ended or stopped",project=name,worker="connection review")
                with repo.sessions.begin() as db:
                    db.add(DashboardEvent(occurred_at=now,level="INFO",event_type=request,source="gitops",project="platform",entity_type="operation",entity_id=request,message="Stopped active OpenAI and Anthropic review work on operator request.",metadata_json={}))
                log("completed", at=datetime.now(UTC).isoformat())
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: password
            - name: ENGINEERING_DATABASE_URL
              value: postgresql+psycopg://$(DATABASE_USER):$(DATABASE_PASSWORD)@engineering-control-postgres-rw:5432/engineering_control
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
