# Temporal for the platform: its own PostgreSQL, the schema, one server pod running the
# four services, and the platform's namespace. The server image does not build its
# configuration from environment variables, so the pod renders the file below at start
# (pod address and database password), the way the Temporal already on this cluster does.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engineering-control-temporal-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: temporal
      owner: temporal
      encoding: UTF8
      dataChecksums: true
      # Temporal keeps its visibility records in a second database.
      postInitSQL:
        - CREATE DATABASE temporal_visibility OWNER temporal ENCODING 'UTF8'
  # Never on the node reserved for sandboxes (see deploy/README.md).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: engineering-control/sandbox
                operator: DoesNotExist
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["aibot"]
  # No storage class is named: the cluster's default is used.
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-control-temporal-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  docker.yaml: |
    log:
      stdout: true
      level: info
    persistence:
      numHistoryShards: 256
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal"
            connectAddr: "engineering-control-temporal-postgres-rw:5432"
            connectProtocol: "tcp"
            user: "temporal"
            password: "__TEMPORAL_DB_PASSWORD__"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal_visibility"
            connectAddr: "engineering-control-temporal-postgres-rw:5432"
            connectProtocol: "tcp"
            user: "temporal"
            password: "__TEMPORAL_DB_PASSWORD__"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "__POD_IP__"
      # The frontend presents the certificate of deploy/base/certificates.yaml. Temporal's
      # own services reach the frontend by the pod address, so they are told which name
      # the certificate carries and which authority signed it.
      tls:
        refreshInterval: 1h
        frontend:
          server:
            certFile: /etc/temporal/tls/tls.crt
            keyFile: /etc/temporal/tls/tls.key
            requireClientAuth: false
          client:
            serverName: engineering-control-temporal
            rootCaFiles:
              - /etc/temporal/tls/ca.crt
      pprof:
        port: 0
    services:
      # The services bind the pod's own IPv4 address. A 0.0.0.0 bind makes the server
      # listen on the IPv6 wildcard, which IPv4 clients on this cluster cannot reach.
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnIP: "__POD_IP__"
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: "__POD_IP__"
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: "__POD_IP__"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: "__POD_IP__"
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "__POD_IP__:7233"
    dcRedirectionPolicy:
      policy: "noop"
    publicClient:
      hostPort: "__POD_IP__:7233"
    dynamicConfigClient:
      filepath: "/tmp/temporal/dynamicconfig/docker.yaml"
      pollInterval: "60s"
  dynamic_config.yaml: |
    system.enableActivityEagerExecution:
      - value: true
    frontend.enableUpdateWorkflowExecution:
      - value: true
    history.enableRequestIdRefLinks:
      - value: true
---
# Applies the Temporal schemas. Safe to repeat: the update step applies only what is missing.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control-temporal
        app.kubernetes.io/component: temporal-schema
    spec:
      restartPolicy: Never
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: schema
          image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
          command:
            - /bin/sh
            - -ec
            - |
              endpoint=engineering-control-temporal-postgres-rw
              apply() { # <database> <schema directory>
                tool="temporal-sql-tool --plugin postgres12 --ep ${endpoint} -p 5432 -u ${SQL_USER} --db $1"
                # The first step fails once the version tables exist; the second is the gate.
                ${tool} setup-schema -v 0.0 || echo "version tables for $1 already present"
                ${tool} update-schema -d "/etc/temporal/schema/postgresql/v12/$2/versioned"
              }
              apply temporal temporal
              apply temporal_visibility visibility
              echo "Temporal schemas are current"
          env:
            - name: HOME
              value: /tmp
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-temporal-postgres-app
                  key: username
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-temporal-postgres-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-control-temporal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: engineering-control-temporal
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-control-temporal
      app.kubernetes.io/component: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control-temporal
        app.kubernetes.io/component: temporal
    spec:
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: temporal
          image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /tmp/temporal/config /tmp/temporal/dynamicconfig
              escaped=$(printf '%s' "${SQL_PASSWORD}" | sed 's|[&/\\]|\\&|g')
              sed -e "s/__POD_IP__/${POD_IP}/g" \
                  -e "s/__TEMPORAL_DB_PASSWORD__/${escaped}/g" \
                /etc/temporal/config-src/docker.yaml > /tmp/temporal/config/docker.yaml
              cp /etc/temporal/config-src/dynamic_config.yaml /tmp/temporal/dynamicconfig/docker.yaml
              exec /etc/temporal/entrypoint.sh
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BIND_ON_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TEMPORAL_ROOT
              value: /tmp/temporal
            - name: TEMPORAL_CONFIG_DIR
              value: config
            - name: TEMPORAL_ENVIRONMENT
              value: docker
            - name: HOME
              value: /tmp
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-temporal-postgres-app
                  key: username
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-temporal-postgres-app
                  key: password
          ports:
            - name: grpc
              containerPort: 7233
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: config-src
              mountPath: /etc/temporal/config-src
              readOnly: true
            - name: tls
              mountPath: /etc/temporal/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-src
          configMap:
            name: engineering-control-temporal-config
        - name: tls
          secret:
            secretName: engineering-control-temporal-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-control-temporal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: engineering-control-temporal
    app.kubernetes.io/component: temporal
spec:
  selector:
    app.kubernetes.io/name: engineering-control-temporal
    app.kubernetes.io/component: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
# Registers the platform's Temporal namespace once the server answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control-temporal
        app.kubernetes.io/component: temporal-namespace
    spec:
      restartPolicy: Never
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: namespace
          image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
          # The variable names are deliberately not TEMPORAL_ADDRESS / TEMPORAL_NAMESPACE:
          # the CLI reads those itself and would target a namespace that does not exist yet.
          command:
            - /bin/sh
            - -ec
            - |
              # Every call verifies the server against the platform's certificate authority.
              tls="--tls-ca-path /etc/temporal/tls/ca.crt --tls-server-name ${FRONTEND%%:*}"
              attempt=0
              until temporal operator cluster health --address "${FRONTEND}" ${tls} >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 60 ]; then
                  echo "Temporal did not answer" >&2
                  temporal operator cluster health --address "${FRONTEND}" ${tls} >&2 || true
                  exit 1
                fi
                sleep 5
              done
              if temporal operator namespace describe --address "${FRONTEND}" ${tls} \
                  --namespace "${PLATFORM_NAMESPACE}" >/dev/null 2>&1; then
                echo "namespace ${PLATFORM_NAMESPACE} already exists"
              else
                temporal operator namespace create --address "${FRONTEND}" ${tls} \
                  --namespace "${PLATFORM_NAMESPACE}" --retention 30d
                temporal operator namespace describe --address "${FRONTEND}" ${tls} \
                  --namespace "${PLATFORM_NAMESPACE}" >/dev/null
                echo "namespace ${PLATFORM_NAMESPACE} created"
              fi
          env:
            - name: HOME
              value: /tmp
            - name: FRONTEND
              value: engineering-control-temporal:7233
            - name: PLATFORM_NAMESPACE
              value: engineering-control
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: temporal-ca
              mountPath: /etc/temporal/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The certificate authority only; the key of the server certificate is not mounted.
        - name: temporal-ca
          secret:
            secretName: engineering-control-temporal-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
