# What the original's way of working left in the cluster and holds a data volume. A
# deployment never deletes a volume by itself, so these two stay here until the
# administrator says they can go (deploy/README.md, "What consolidation left behind").
# Nothing of the platform uses either: removing this file from kustomization.yaml and
# syncing with pruning deletes both.
#
# The volume the original's evidence ingest wrote to. What a run leaves behind (what it
# printed, what it found, its usage) is in the platform's database, and its change is a
# branch on GitHub.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engineering-control-evidence
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # No storage class is named: the cluster's default is used.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# The database of the Temporal server the original's workflows ran on. The server is gone;
# its database held Temporal's own state for a namespace in which nothing ever ran here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engineering-control-temporal-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: temporal
      owner: temporal
      encoding: UTF8
      dataChecksums: true
      # Temporal keeps its visibility records in a second database.
      postInitSQL:
        - CREATE DATABASE temporal_visibility OWNER temporal ENCODING 'UTF8'
  # Never on the node reserved for sandboxes (see deploy/README.md).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: engineering-control/sandbox
                operator: DoesNotExist
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["aibot"]
  # No storage class is named: the cluster's default is used.
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
