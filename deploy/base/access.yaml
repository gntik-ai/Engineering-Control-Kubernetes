# The long-running processes have no cluster identity at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-control
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
# The image is in a private registry. This Secret is created by deploy/registry.
imagePullSecrets:
  - name: engineering-control-registry
---
# The console stores the sign-ins of subscription accounts in the sandbox namespace. Its
# identity is not mounted by default: the console's pod asks for a short-lived token
# explicitly. What it may do with it is in deploy/sandboxes/access.yaml: write and delete
# Secrets there, never read one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-control-console
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
imagePullSecrets:
  - name: engineering-control-registry
---
# The launcher starts the sandboxes. Like the console's, its identity is mounted explicitly
# and may act only in the sandbox namespace: on pods, what they print, and volumes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-control-launcher
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
imagePullSecrets:
  - name: engineering-control-registry
---
# The bootstrap Jobs may read and write Secrets in this namespace, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-control-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
imagePullSecrets:
  - name: engineering-control-registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: engineering-control-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["engineering-control-secrets", "engineering-control-admin"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: engineering-control-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: engineering-control-bootstrap
subjects:
  - kind: ServiceAccount
    name: engineering-control-bootstrap
