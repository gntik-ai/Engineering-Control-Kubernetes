# The sandboxes' way out. A sandbox that has to reach its provider, GitHub or a package
# registry may open connections to this proxy and to nothing else; the proxy opens a tunnel
# to port 443 of a host on its list and refuses everything else (the list is the setting
# ENGINEERING_SANDBOX_EGRESS_HOSTS; its default is in the platform's configuration). What
# goes through a tunnel is TLS between the sandbox and that host: the proxy holds no key,
# no sign-in and no cluster identity, and it reads nothing of what passes.
#
# Its log names every host it refused, which is how a host a project turns out to need is
# found.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-control-egress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-control
        app.kubernetes.io/component: egress
    spec:
      serviceAccountName: engineering-control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: egress
          image: engineering-control
          command: ["engineering-egress"]
          ports:
            - name: proxy
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: engineering-control-settings
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The one key the proxy needs: what a step's grant to reach a project's own
            # application is signed with. It holds no other secret of the platform.
            - name: grant-key
              mountPath: /var/run/secrets/engineering-control
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: grant-key
          secret:
            secretName: engineering-control-secrets
            defaultMode: 0440
            optional: true
            items:
              - key: egress-grant.key
                path: egress-grant.key
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-control-egress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: egress
spec:
  selector:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: egress
  ports:
    - name: proxy
      port: 8888
      targetPort: proxy
