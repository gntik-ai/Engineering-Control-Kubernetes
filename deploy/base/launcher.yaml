# Starts and watches the sandboxes: one pod per step of a run, in the sandbox namespace.
# It has no listener. Its identity may act in the sandbox namespace only, on pods and
# volumes (deploy/sandboxes/access.yaml); it cannot read a Secret anywhere. It also holds
# the GitHub App's key, because checking a repository out and publishing an approved change
# are its work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-control-launcher
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: engineering-control
    app.kubernetes.io/component: launcher
spec:
  # One launcher: two would both start the same step.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: launcher
  template:
    metadata:
      annotations:
        # Where the process says how it is doing (health.py): read by a Prometheus that
        # follows these annotations, or by the monitors in deploy/monitoring.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8799"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: engineering-control
        app.kubernetes.io/component: launcher
    spec:
      serviceAccountName: engineering-control-launcher
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never on the node reserved for sandboxes (see deploy/README.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: engineering-control/sandbox
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["aibot"]
      containers:
        - name: launcher
          image: engineering-control
          command: ["engineering-launcher"]
          ports:
            - name: health
              containerPort: 8799
          envFrom:
            - configMapRef:
                name: engineering-control-settings
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engineering-control-postgres-app
                  key: password
            - name: ENGINEERING_DATABASE_URL
              value: postgresql+psycopg://$(DATABASE_USER):$(DATABASE_PASSWORD)@engineering-control-postgres-rw:5432/engineering_control
            # The image a sandbox runs. kustomization.yaml pins it to the same commit as
            # the control plane's own image.
            - name: ENGINEERING_SANDBOX_IMAGE
              value: engineering-control-sandbox
          # A loop that stands is a process to restart: /healthz says so (health.py).
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/engineering-control
              readOnly: true
            - name: cluster
              mountPath: /var/run/secrets/engineering-control-cluster
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/engineering-control-github-app
              readOnly: true
            - name: state
              mountPath: /var/lib/engineering-control
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: engineering-control-secrets
            defaultMode: 0440
        # The launcher's identity towards the cluster: a token valid for an hour, renewed
        # by the kubelet, readable by the launcher's group only.
        - name: cluster
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        # The GitHub App's private key. The launcher issues a token for one repository when
        # a run checks it out, and publishes a change the administrator approved.
        - name: github-app
          secret:
            secretName: engineering-control-github-app
            optional: true
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
