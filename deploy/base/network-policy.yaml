# The control-plane pods accept connections only from their own namespace. Outbound traffic
# is not restricted yet; that comes with the sandbox namespace. The database pods are left
# out on purpose: their operator, in another namespace, has to reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
# The console is the one process with a route from outside. Its HTTP port accepts
# connections from anywhere in the cluster, because the ingress controller's namespace and
# labels are not known yet (it is not visible through Argo CD, and a rule on the usual
# `ingress-nginx` label left the console unreachable). Narrow this to the controller once
# `docs/design/cluster-facts.sh` has been run. What it opens is the sign-in page that is
# public anyway; no other port and no other pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-http
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: console
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8750
---
# Temporal accepts connections only from this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control-temporal
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
