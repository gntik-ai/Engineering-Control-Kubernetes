# The control-plane pods accept connections only from their own namespace. Outbound traffic
# is not restricted yet; that comes with the sandbox namespace. The database pods are left
# out on purpose: their operator, in another namespace, has to reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
# The console is the one process with a route from outside. The ingress controller runs on
# a node's own network (mus-srv-0), so the console sees its connections arrive from a node
# address, which a rule that selects pods can never match. Its HTTP port therefore accepts
# the cluster's nodes and nothing else: each node's address and the address its traffic to
# pods on other nodes carries (the first address of its pod range). No pod outside the
# namespace can reach the console. If a node is added or renumbered, this list and
# ENGINEERING_DASHBOARD_TRUSTED_PROXY_NETWORKS change with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-http
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control
      app.kubernetes.io/component: console
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # mus-srv-0, where the ingress controller runs
        - ipBlock: {cidr: 10.0.1.1/32}
        - ipBlock: {cidr: 10.42.0.0/32}
        # kind
        - ipBlock: {cidr: 100.64.0.7/32}
        - ipBlock: {cidr: 10.42.3.0/32}
        # github-actions
        - ipBlock: {cidr: 100.64.0.6/32}
        - ipBlock: {cidr: 10.42.5.0/32}
        # aibot
        - ipBlock: {cidr: 100.64.0.5/32}
        - ipBlock: {cidr: 10.42.17.0/32}
      ports:
        - protocol: TCP
          port: 8750
---
# Temporal accepts connections only from this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engineering-control-temporal
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
