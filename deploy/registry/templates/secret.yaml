{{- if .Values.token }}
apiVersion: v1
kind: Secret
metadata:
  name: engineering-control-registry
  labels:
    app.kubernetes.io/part-of: engineering-control
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "ghcr.io" (dict "username" .Values.username "password" .Values.token)) | toJson | b64enc | quote }}
{{- end }}
