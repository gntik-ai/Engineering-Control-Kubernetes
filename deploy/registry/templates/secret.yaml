{{- if .Values.token }}
{{- /* The same Secret in each namespace that pulls the platform's private images: the
       control plane's own (the application's destination) and the sandboxes'. */}}
{{- range $namespace := list .Release.Namespace .Values.sandboxNamespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: engineering-control-registry
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/part-of: engineering-control
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "ghcr.io" (dict "username" $.Values.username "password" $.Values.token)) | toJson | b64enc | quote }}
{{- end }}
{{- end }}
