routes:
  - id: "1004"
    uri: "/*"
    upstream:
      nodes:
        "falcone-web-console.falcone.svc.cluster.local:3000": 1
  - id: "2006"
    uri: "/v1/mongo/*"
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    upstream:
      nodes:
        "falcone-control-plane-executor.falcone.svc.cluster.local:8080": 1
  - id: "2003-keys"
    uri: "/v1/workspaces/*"
    vars: [["uri", "~~", "^/v1/workspaces/[^/]+/api-keys"]]
    upstream:
      nodes:
        "falcone-control-plane-executor.falcone.svc.cluster.local:8080": 1
  - id: "2007-key"
    uri: "/v1/workspaces/*"
    vars: [["http_apikey", "~~", "^flc_"]]
    upstream:
      nodes:
        "falcone-control-plane-executor.falcone.svc.cluster.local:8080": 1
  - id: "5000"
    uri: "/v1/*"
    upstream:
      nodes:
        "falcone-control-plane.falcone.svc.cluster.local:8080": 1
