name: engineering-control-infrastructure

services:
  postgresql:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: engineering-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ${ENGINEERING_POSTGRES_DATA_ROOT:-/var/lib/engineering-control/postgresql}:/var/lib/postgresql/data
    networks: [control-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5

  database-bootstrap:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: engineering-database-bootstrap
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${POSTGRES_ADMIN_USER:?required}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      ENGINEERING_DB_PASSWORD: ${ENGINEERING_DB_PASSWORD:?required}
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-databases.sh"]
    volumes:
      - ./bootstrap-databases.sh:/bootstrap/bootstrap-databases.sh:ro
    networks: [control-internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    container_name: engineering-temporal-schema
    restart: "no"
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PWD: ${POSTGRES_ADMIN_PASSWORD:?required}
      SQL_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
    entrypoint: ["/bin/sh", "/bootstrap/setup-temporal-schema.sh"]
    volumes:
      - ./setup-temporal-schema.sh:/bootstrap/setup-temporal-schema.sh:ro
    networks: [control-internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  temporal:
    image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    container_name: engineering-temporal
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PWD: ${POSTGRES_ADMIN_PASSWORD:?required}
      VISIBILITY_POSTGRES_SEEDS: postgresql
      VISIBILITY_POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      VISIBILITY_POSTGRES_PWD: ${POSTGRES_ADMIN_PASSWORD:?required}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/engineering.yaml
      NUM_HISTORY_SHARDS: 256
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:7233:7233"
      - "10.10.0.2:7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [control-internal]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 2048m
    cpus: 2.0

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    container_name: engineering-temporal-namespace
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: engineering-control
    entrypoint: ["/bin/sh", "/bootstrap/create-namespace.sh"]
    volumes:
      - ./create-namespace.sh:/bootstrap/create-namespace.sh:ro
    networks: [control-internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  temporal-ui:
    image: temporalio/ui:2.53.3@sha256:eef301146e60fad34b47adaecfae4149016e34b2d44ba94fca5fd8e5441f182a
    container_name: engineering-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8741
    ports:
      - "127.0.0.1:8741:8080"
    networks: [control-internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5

networks:
  control-internal:
    name: engineering-control-internal
    driver: bridge
