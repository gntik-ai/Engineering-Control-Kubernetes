[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "engineering-control"
version = "0.1.0"
description = "Durable, policy-driven engineering control plane for Falcone and Musematic"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "Jinja2>=3.1.6,<4",
  "jsonschema>=4.25,<5",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy>=2.0.43,<3",
  "structlog>=25.4,<26",
  "temporalio>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26.0.20260518,<5",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
engineering-api = "engineering_control.api.main:run"
engineering-dashboard = "engineering_control.dashboard.app:run"
engineering-worker = "engineering_control.workflows.worker:run"
engineering-role-worker = "engineering_control.workflows.role_worker:run"
engineering-scheduler = "engineering_control.scheduler:run"
engineering-notifier = "engineering_control.notifier:run"
engineering-evidence-ingest = "engineering_control.evidence.ingest:run"
engineering-acceptance-worker = "engineering_control.validation.worker:run"
engineering-ctl = "engineering_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_control"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgresql: requires an explicitly supplied disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engineering_control"]
