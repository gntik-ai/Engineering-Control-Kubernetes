# NEW-228 (2026-10-22): the loopback shell (scripts/agent-loopback-shell) gives every Bash
# command of a loopback-enabled Claude run a PID namespace and a procfs of its own, so the
# command cannot read the Claude CLI's /proc/<pid>/environ (its credentials). The
# template's ProtectKernelTunables=true bind-mounts /proc/sys, /proc/sysrq-trigger,
# /proc/kcore... over this unit's /proc; in bubblewrap's user namespace those mounts are
# locked, so the kernel refuses any new procfs ("bwrap: Can't mount proc on
# /newroot/proc: Operation not permitted", gntik-ui #247). For the claude worker only:
# no mounts over /proc. The shell re-applies the same /proc table (read-only, kcore and
# kallsyms masked) over the sandbox's own procfs; /sys stays read-only as before (the
# private cgroup mount of 60-cgroup-delegation.conf stays writable); the runner holds no
# capabilities, so the kernel tunables stay writable by root only. Codex and the other
# workers keep ProtectKernelTunables=true.
[Service]
ProtectKernelTunables=false
ReadOnlyPaths=/sys
