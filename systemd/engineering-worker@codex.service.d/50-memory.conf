# NEW-47: makers/checkers run the project's full test suites inside this worker's
# cgroup; the template's 3G cap OOM-killed the codex worker three times on
# 2026-09-24 (musematic control-plane pytest + vitest + the agent).
# NEW-167 (2026-10-09): the gntik-ui maker (pnpm -r test across 11 vitest packages plus
# a Next.js build) OOM-killed the codex worker 14 times at 5G. On the 15G worker host
# each agent worker may use 7G (reclaim pressure from 6G), inside the shared 9G
# engineering-workers-agents.slice (9G) inside engineering-workers.slice (13G).
# NEW-226 (2026-10-19): NEW-214 Stage 2 runs up to 2 codex makers at once, and one
# maker alone (falcone #1190, a 4.45G `node --test`) held the worker at 5.9G anonymous
# memory and 96% "full" pressure under the 6G MemoryHigh. Codex gets 1G more (8G,
# reclaim pressure from 7G); claude keeps 6G/7G (checkers); the agents slice grows to
# 10.5G to hold both. Each run's own cgroup is capped at MemoryHigh less 1G (6G), so one
# runaway command is OOM-killed inside its run before the whole worker is throttled.
[Service]
Slice=engineering-workers-agents.slice
MemoryHigh=7G
MemoryMax=8G
