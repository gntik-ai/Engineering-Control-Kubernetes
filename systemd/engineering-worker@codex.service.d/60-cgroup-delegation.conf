# NEW-188 (2026-10-12): each agent run gets a cgroup of its own that the kernel kills
# whole (cgroup.kill) when the run ends, whatever its processes did with sessions,
# process groups or signal handlers. Delegation hands the worker its subtree; the worker
# runs in the "supervisor" subgroup and creates agent-run-* cgroups beside it. "private"
# runs the unit in a cgroup namespace: only its own subtree is visible and writable.
[Service]
Delegate=yes
DelegateSubgroup=supervisor
ProtectControlGroups=private
