name: CI

# Every push runs lint, type checks, the unit suite, the console build, the control-plane
# image build and boot test, and the sandbox image build and smoke test. An image that
# passes is pushed to the private registry, tagged with its commit. Nothing here deploys:
# Argo CD does, from deploy/base.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install constrained project and development dependencies
        run: python -m pip install --constraint requirements.lock --editable ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Deployment manifests render
        run: |
          kubectl kustomize deploy/base > /tmp/base.yaml
          # The patch that pins the sandbox image must have reached the launcher.
          grep --quiet 'value: ghcr.io/gntik-ai/engineering-control-kubernetes-sandbox:' /tmp/base.yaml
          kubectl kustomize deploy/sandboxes > /dev/null
          test -z "$(helm template deploy/registry)"
          helm template deploy/registry --set username=someone --set token=example \
            > /tmp/registry.yaml
          test "$(grep --count 'kubernetes.io/dockerconfigjson' /tmp/registry.yaml)" = 2
          grep --quiet 'namespace: engineering-control-sandboxes' /tmp/registry.yaml

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install constrained project and development dependencies
        run: python -m pip install --constraint requirements.lock --editable ".[dev]"
      - name: Run the unit suite
        # A real PostgreSQL is met in the image's boot test, which runs the migrations.
        run: python -m pytest -q -n auto -p no:cacheprovider

  console:
    name: Console build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: The committed bundle matches the source
        # The Python package ships the built console; a source change without a rebuild
        # would deploy a stale page.
        working-directory: .
        run: |
          git status --short src/engineering_control/dashboard/console
          git diff --exit-code -- src/engineering_control/dashboard/console
          test -z "$(git status --porcelain -- src/engineering_control/dashboard/console)"

  image:
    name: Control-plane image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/control/Dockerfile
          load: true
          tags: engineering-control:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm engineering-control:ci python - <<'PY'
          import os

          import engineering_control
          from engineering_control.dashboard.app import CONSOLE_ROOT, sign_in_assets
          from engineering_control.sandbox.egress import run as egress
          from engineering_control.sandbox.launcher import run as launcher
          from engineering_control.chat.service import run as chat
          from engineering_control.supervisor.service import run as tools
          from engineering_control.engine.builtin import BUILTIN

          assert os.geteuid() != 0, "the image must not run as root"
          assert (CONSOLE_ROOT / "index.html").is_file(), "console bundle missing"
          assert (CONSOLE_ROOT / "login.html").is_file(), "sign-in page missing"
          assert sign_in_assets(), "the sign-in page names no files"
          assert BUILTIN, "no flows of the platform's own"
          assert callable(launcher), "the launcher is missing"
          print("ok", engineering_control.__name__, len(BUILTIN), "flows")
          PY
          docker run --rm engineering-control:ci alembic --help >/dev/null
          # The export script for the original system's records is handed out by the
          # console and by the command line: it has to be in the image.
          docker run --rm engineering-control:ci engineering-ctl records script | grep -q "SET TRANSACTION READ ONLY"
      - name: Boot the image as a cluster would
        # Non-root, read-only filesystem, secrets as a mounted Secret volume, a real
        # PostgreSQL: migrations, the console, the sandboxes' proxy, the supervisor's
        # tools and the chat channel must all start from configuration alone.
        run: images/control/boot-test.sh engineering-control:ci
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image, tagged with its commit
        # Only an image that passed the boot test is pushed. The package is private, like
        # this repository; deploy/base/kustomization.yaml pins the commit to deploy.
        run: |
          image=ghcr.io/gntik-ai/engineering-control-kubernetes
          docker tag engineering-control:ci "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"

  sandbox:
    name: Sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        # The context is the image's own directory: nothing else in the repository can
        # end up in a sandbox.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/sandbox
          load: true
          tags: engineering-control-sandbox:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Smoke test the image as a run would use it
        # Unprivileged, read-only, no capabilities, no network: every pinned tool at its
        # pinned version, no credentials, nothing that reaches the cluster or GitHub.
        run: images/sandbox/smoke-test.sh engineering-control-sandbox:ci
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image, tagged with its commit
        # Only an image that passed the smoke test is pushed, to a private package of its
        # own, so that the control plane and the sandboxes are pinned separately.
        run: |
          image=ghcr.io/gntik-ai/engineering-control-kubernetes-sandbox
          docker tag engineering-control-sandbox:ci "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
